}

function saveTaskFromModal(){
  if(blockIfViewOnly()) return;
  const title = document.getElementById('f_title').value.trim();
  if(!title){ toast(t('required_field'), 'err'); return; }
  const description = document.getElementById('f_desc').value.trim();
  const assigneeId = document.getElementById('f_assignee').value;
  const priority = document.getElementById('f_priority').value;
  const startDate = document.getElementById('f_start').value;
  const dueDate = document.getElementById('f_due').value;
  const newStatus = document.getElementById('f_status').value;

  const catSelectVal = document.getElementById('f_category_select').value;
  let categoryId = '', categoryCustom = '';
  if(catSelectVal === '__custom__'){
    categoryCustom = document.getElementById('f_category_custom').value.trim();
  } else if(catSelectVal){
    categoryId = catSelectVal;
  }

  const isPending = document.getElementById('f_is_pending').checked;
  const pendingReason = isPending ? document.getElementById('f_pending_reason').value.trim() : '';

  let completedDateVal = '';
  if(newStatus === 'completed'){
    const completedInput = document.getElementById('f_completed_date');
    completedDateVal = (completedInput && completedInput.value) ? completedInput.value : todayISO();
    if(startDate && completedDateVal < startDate){
      toast(t('completed_before_start_warning'), 'warn');
      completedDateVal = startDate;
    }
  }

  if(editingTaskId){
    const tk = state.tasks.find(x=>x.id===editingTaskId);
    tk.title = title; tk.description = description; tk.assigneeId = assigneeId;
    tk.priority = priority; tk.startDate = startDate; tk.dueDate = dueDate;
    tk.categoryId = categoryId; tk.categoryCustom = categoryCustom;
    if(isPending && !tk.isPending) tk.pendingSince = todayISO();
    if(!isPending) tk.pendingSince = null;
    tk.isPending = isPending; tk.pendingReason = pendingReason;
    if(newStatus === 'completed'){
      updateTaskStageDates(tk, newStatus, completedDateVal);
    } else if(tk.status !== newStatus){
      updateTaskStageDates(tk, newStatus);
    }
    saveData();
    toast(t('task_updated'));
  } else {
    const tk = {
      id: uid('task'), title, description, assigneeId, priority, status:'receiving',
      categoryId, categoryCustom,
      isPending, pendingReason, pendingSince: isPending ? todayISO() : null,
      startDate: startDate||todayISO(), dueDate, completedDate:null,
      stageDates:{receiving: startDate||todayISO()}, kpis:[], comments:[], createdAt: Date.now()
    };
    if(newStatus === 'completed'){
      updateTaskStageDates(tk, newStatus, completedDateVal);
    } else if(newStatus !== 'receiving'){
      updateTaskStageDates(tk, newStatus);
    }
    state.tasks.push(tk);
    saveData();
    toast(t('task_created'));
    checkAndNotify(tk);
  }
  closeModal();
  renderPage();
}

  const scores = [];
  state.tasks.forEach(tk => (tk.kpis||[]).forEach(k => { if(k.employeeId===empId) scores.push(k.score); }));
  return scores.length ? scores.reduce((a,b)=>a+b,0)/scores.length : 0;
}

function bulkDeleteEmployees(){

  toast(t('emp_deleted'));

  state.employeeUsers = state.employeeUsers.filter(a => a.employeeId !== id);

function reportSortIcon(col){
  if(state.ui.reportSortCol !== col) return '<i class="fa-solid fa-sort"></i>';
  return state.ui.reportSortDir==='asc' ? '<i class="fa-solid fa-sort-up"></i>' : '<i class="fa-solid fa-sort-down"></i>';

function setReportSortCol(col){
  if(state.ui.reportSortCol === col) state.ui.reportSortDir = state.ui.reportSortDir==='asc'?'desc':'asc';
  else { state.ui.reportSortCol = col; state.ui.reportSortDir='asc'; }
  renderPage();
}
function sortReportTasks(tasks){
  const col = state.ui.reportSortCol || 'due';
  const dir = (state.ui.reportSortDir||'asc')==='asc' ? 1 : -1;
  return [...tasks].sort((a,b) => {
    let va, vb;
    switch(col){
      case 'title': va=a.title||''; vb=b.title||''; return va.localeCompare(vb, state.lang) * dir;
      case 'assignee': va=employeeName(a.assigneeId); vb=employeeName(b.assigneeId); return va.localeCompare(vb, state.lang) * dir;
      case 'status': va=STAGES.indexOf(a.status); vb=STAGES.indexOf(b.status); return (va-vb)*dir;
      case 'priority': const order={low:0,medium:1,high:2,urgent:3}; return (order[a.priority]-order[b.priority])*dir;
      case 'category': va=taskCategoryDisplayName(a); vb=taskCategoryDisplayName(b); return va.localeCompare(vb, state.lang) * dir;
      case 'start': va=a.startDate||''; vb=b.startDate||''; return va.localeCompare(vb)*dir;
      case 'due': va=a.dueDate||'9999'; vb=b.dueDate||'9999'; return va.localeCompare(vb)*dir;
      case 'workdays': va=calcWorkDays(a.startDate,a.completedDate||todayISO()); vb=calcWorkDays(b.startDate,b.completedDate||todayISO()); return (va-vb)*dir;
      default: return 0;
    }
  });
}

function filterKpisByPeriod(){
  const period = state.ui.kpiPeriod;
  const now = new Date();
  return function(dateISO){
    if(period==='all') return true;
    const d = new Date(dateISO+'T00:00:00');
    if(period==='month') return d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth();
    if(period==='lastmonth'){
      const lm = new Date(now.getFullYear(), now.getMonth()-1, 1);
      return d.getFullYear()===lm.getFullYear() && d.getMonth()===lm.getMonth();
    }
    if(period==='quarter'){
      const q = Math.floor(now.getMonth()/3);
      const dq = Math.floor(d.getMonth()/3);
      return d.getFullYear()===now.getFullYear() && dq===q;
    }
    return true;
  };
}
function performanceLevel(avg){
  if(avg >= 9) return {key:'perf_excellent', color:'var(--emerald-600)', hex:'#0E6E5A', icon:'fa-trophy'};
  if(avg >= 7) return {key:'perf_good', color:'var(--emerald-400)', hex:'#1FA987', icon:'fa-thumbs-up'};
  if(avg >= 4) return {key:'perf_acceptable', color:'var(--gold-500)', hex:'#D4A017', icon:'fa-circle-half-stroke'};
  if(avg > 0) return {key:'perf_weak', color:'var(--red-500)', hex:'#D4453D', icon:'fa-triangle-exclamation'};
  return {key:'perf_none', color:'var(--ink-300)', hex:'#A6ACC4', icon:'fa-minus'};
}
function performanceLevelHex(avg){ return performanceLevel(avg).hex; }
function applyKpiScoreFilter(data){
  const f = state.ui.kpiScoreFilter;
  if(!f || f.mode === 'none') return data;
  return data.filter(d => {
    if(f.mode === 'above') return d.avg > (f.a ?? 0);
    if(f.mode === 'below') return d.avg < (f.a ?? 10);
    if(f.mode === 'between') return d.avg >= Math.min(f.a??0,f.b??10) && d.avg <= Math.max(f.a??0,f.b??10);
    return true;
  });
}

  state.kpiDefinitions = state.kpiDefinitions.filter(d => d.id !== id);

  <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
    <div class="modal">
      <div class="modal-head">
        <h3><i class="fa-solid fa-tags" style="color:var(--violet-600); margin-inline-end:8px;"></i>${t('manage_categories')}</h3>
        <button class="modal-close" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="modal-body" id="taskCategoriesModalBody">
        ${renderTaskCategoriesList()}
      </div>
      <div class="modal-foot"><button class="btn btn-outline" onclick="closeModal()">${t('close')}</button></div>
    </div>
  </div>`;
}
function renderTaskCategoriesList(){
  return `
  <div class="kpi-list" style="margin-bottom:16px;">
    ${state.taskCategories.length ? state.taskCategories.map(c => `
      <div class="kpi-item">
        <div class="kpi-icon" style="background:var(--violet-500); width:30px; height:30px; flex-shrink:0;"><i class="fa-solid fa-tag" style="font-size:11px;"></i></div>
        <div style="flex:1;"><div class="ki-name">${escapeHtml(categoryName(c))}</div></div>
        <button class="icon-mini" onclick="openEditCategoryForm('${c.id}')" title="${t('edit')}"><i class="fa-solid fa-pen"></i></button>
        <button class="icon-mini danger" onclick="deleteTaskCategory('${c.id}')" title="${t('delete')}"><i class="fa-solid fa-trash"></i></button>
      </div>`).join('') : `<div class="empty-state" style="padding:16px;"><i class="fa-solid fa-tags"></i>${t('no_categories')}</div>`}
  </div>
  <div class="card" id="categoryFormWrap" style="padding:14px; background:var(--bg-soft); border:1px dashed var(--line);">
    ${renderCategoryForm()}
  </div>`;
}
let editingCategoryId = null;
function renderCategoryForm(){
  const cat = editingCategoryId ? getTaskCategory(editingCategoryId) : null;
  return `
  <div class="section-title" style="font-size:13px; margin-bottom:10px;"><i class="fa-solid fa-${cat?'pen':'plus'}"></i>${cat ? t('edit_category') : t('new_category')}</div>
  <div class="field-row">
    <div class="field" style="margin-bottom:8px;">
      <label>${t('kpi_def_name_ar')}</label>
      <input class="input" id="cat_name_ar" value="${escapeHtml(cat ? (cat.name_ar||'') : '')}" placeholder="${t('kpi_def_name_ar')}">
    </div>
    <div class="field" style="margin-bottom:8px;">
      <label>${t('kpi_def_name_en')}</label>
      <input class="input" id="cat_name_en" value="${escapeHtml(cat ? (cat.name_en||'') : '')}" placeholder="${t('kpi_def_name_en')}">
    </div>
  </div>
  <div style="display:flex; gap:8px;">
    <button class="btn btn-violet btn-sm" onclick="saveTaskCategory()"><i class="fa-solid fa-check"></i>${t('save')}</button>
    ${cat ? `<button class="btn btn-outline btn-sm" onclick="cancelEditCategory()">${t('cancel')}</button>` : ''}
  </div>`;
}
function openEditCategoryForm(id){
  editingCategoryId = id;
  document.getElementById('taskCategoriesModalBody').innerHTML = renderTaskCategoriesList();
}
function cancelEditCategory(){
  editingCategoryId = null;
  document.getElementById('taskCategoriesModalBody').innerHTML = renderTaskCategoriesList();
}
function saveTaskCategory(){
  if(blockIfViewOnly()) return;
  const nameAr = document.getElementById('cat_name_ar').value.trim();
  const nameEn = document.getElementById('cat_name_en').value.trim();
  if(!nameAr && !nameEn){ toast(t('required_field'), 'err'); return; }
  if(editingCategoryId){
    const cat = getTaskCategory(editingCategoryId);
    if(cat){ cat.name_ar = nameAr || cat.name_ar; cat.name_en = nameEn || cat.name_en; }
    toast(t('category_updated'));
  } else {
    state.taskCategories.push({id: uid('cat'), name_ar: nameAr || nameEn, name_en: nameEn || nameAr});
    toast(t('category_created'));
  }
  editingCategoryId = null;
  saveData();
  document.getElementById('taskCategoriesModalBody').innerHTML = renderTaskCategoriesList();
  renderTaskModalCategorySelectIfOpen();
  renderPage();
}
function deleteTaskCategory(id){
  if(blockIfViewOnly()) return;
  const usedCount = state.tasks.filter(tk => tk.categoryId === id).length;
  const msg = usedCount ? `${t('confirm_delete_category_used')} (${usedCount})` : t('confirm_delete_category');
  if(!confirm(msg)) return;
  state.taskCategories = state.taskCategories.filter(c => c.id !== id);
  saveData();
  document.getElementById('taskCategoriesModalBody').innerHTML = renderTaskCategoriesList();
  renderPage();
  toast(t('category_deleted'));
}
function renderTaskModalCategorySelectIfOpen(){
  // If the task edit modal is behind this one, nothing to refresh live; category list refreshes next time it's opened.
}

/* ---- Stage standard-duration settings (editable, drives SLA/timeliness) ---- */
function openStageDurationsModal(){
  document.getElementById('modalRoot').innerHTML = `
  <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
    <div class="modal">
      <div class="modal-head">
        <h3><i class="fa-solid fa-stopwatch" style="color:var(--violet-600); margin-inline-end:8px;"></i>${t('manage_durations')}</h3>
        <button class="modal-close" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="modal-body">
        <p class="field-hint" style="margin-bottom:14px;">${t('manage_durations_hint')}</p>
        <div class="kpi-list" style="margin-bottom:6px;">
          ${STAGES.map(s => `
            <div class="kpi-item">
              <div style="flex:1;">
                <div class="ki-name">${t(STAGE_LABEL_KEY[s])}</div>
                <div class="muted" style="font-size:10.5px; margin-top:2px;">${stageStakeholdersLabel(s)}</div>
              </div>
              <input class="input" type="number" min="0" step="0.5" id="dur_${s}" value="${getStageDuration(s)}" style="width:90px; text-align:center; flex-shrink:0;">
              <span class="muted" style="font-size:11.5px; flex-shrink:0;">${t('days')}</span>
            </div>`).join('')}
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-outline" onclick="resetStageDurations()">${t('reset_defaults')}</button>
        <button class="btn btn-primary" onclick="saveStageDurations()"><i class="fa-solid fa-check"></i>${t('save')}</button>
      </div>
    </div>
  </div>`;
}
function saveStageDurations(){
  if(blockIfViewOnly()) return;
  const updated = {};
  STAGES.forEach(s => {
    const val = parseFloat(document.getElementById('dur_'+s).value);
    updated[s] = isNaN(val) || val < 0 ? getStageDuration(s) : val;
  });
  state.stageDurations = updated;
  saveSettings();
  closeModal();
  renderPage();
  toast(t('durations_saved'));
}
function resetStageDurations(){
  if(blockIfViewOnly()) return;
  state.stageDurations = Object.assign({}, STAGE_DURATION_DAYS);
  saveSettings();
  openStageDurationsModal();
  toast(t('durations_reset'));
}

/* ---- Employee multi-select filter (KPI page) ---- */
function toggleEmpFilterDropdown(){
  const el = document.getElementById('empFilterDropdown');
  if(el) el.classList.toggle('hidden');
}
function toggleKpiEmployeeFilter(empId){
  const set = state.ui.kpiEmployeeFilter;
  if(set.has(empId)) set.delete(empId); else set.add(empId);
  renderPage();
  setTimeout(() => { const el = document.getElementById('empFilterDropdown'); if(el) el.classList.remove('hidden'); }, 0);
}
function clearKpiEmployeeFilter(){
  state.ui.kpiEmployeeFilter.clear();
  renderPage();
}
function updateKpiSearchText(val){
  state.ui.kpiSearchText = val;
  renderPage();
}

function renderKpiPage(){
  const periodFilter = filterKpisByPeriod();
  const empFilterSet = state.ui.kpiEmployeeFilter;
  const defFilter = state.ui.kpiDefFilter;
  const searchText = (state.ui.kpiSearchText||'').toLowerCase().trim();

  function evalMatchesFilters(k, tk){
    if(defFilter && k.defId !== defFilter) return false;
    if(searchText){
      const hay = (kpiEvalDisplayName(k) + ' ' + (tk?tk.title:'') + ' ' + employeeName(k.employeeId)).toLowerCase();
      if(!hay.includes(searchText)) return false;
    }
    return true;
  }

  let data = state.employees
    .filter(e => empFilterSet.size===0 || empFilterSet.has(e.id))
    .map(e => {
      const allKpis = [];
      state.tasks.forEach(tk => (tk.kpis||[]).forEach(k => {
        if(k.employeeId===e.id && periodFilter(k.date) && evalMatchesFilters(k, tk)) allKpis.push(k);
      }));
      const avg = allKpis.length ? allKpis.reduce((a,b)=>a+b.score,0)/allKpis.length : 0;
      const doneTasks = state.tasks.filter(tk => tk.assigneeId===e.id && tk.status==='completed' && (periodFilter(tk.completedDate||tk.createdAt ? (tk.completedDate||todayISO()) : todayISO()))).length;
      return {e, avg, count: allKpis.length, doneTasks};
    }).sort((a,b)=> b.avg-a.avg);

  const fullData = data;
  const f = state.ui.kpiScoreFilter || {mode:'none'};
  const filteredData = applyKpiScoreFilter(data);

  const levelGroups = {perf_excellent:[], perf_good:[], perf_acceptable:[], perf_weak:[], perf_none:[]};
  fullData.forEach(d => { levelGroups[performanceLevel(d.avg).key].push(d); });

  const activeEmpNames = empFilterSet.size ? state.employees.filter(e=>empFilterSet.has(e.id)).map(e=>e.name) : [];

  return `
  <div class="toolbar">
    <div class="section-title" style="margin-bottom:0;"><i class="fa-solid fa-gauge-high"></i>${t('kpi_overview')}</div>
    <div class="grow"></div>
    <button class="btn btn-outline no-view-only" onclick="openKpiDefsModal()"><i class="fa-solid fa-sliders"></i>${t('manage_kpi_defs')}</button>
    <select class="input" style="width:auto;" onchange="state.ui.kpiPeriod=this.value; renderPage();">
      <option value="all" ${state.ui.kpiPeriod==='all'?'selected':''}>${t('kpi_all_time')}</option>
      <option value="month" ${state.ui.kpiPeriod==='month'?'selected':''}>${t('kpi_this_month')}</option>
      <option value="lastmonth" ${state.ui.kpiPeriod==='lastmonth'?'selected':''}>${t('kpi_last_month')}</option>
      <option value="quarter" ${state.ui.kpiPeriod==='quarter'?'selected':''}>${t('kpi_this_quarter')}</option>
    </select>
  </div>

  <div class="panel" style="margin-bottom:14px;">
    <div class="panel-head"><h3><i class="fa-solid fa-magnifying-glass"></i>${t('kpi_search_title')}</h3></div>
    <div class="field-row" style="grid-template-columns:1.3fr 1fr 1fr;">
      <div class="field" style="margin-bottom:0;">
        <label>${t('kpi_search_text_label')}</label>
        <input class="input" type="text" placeholder="${t('kpi_search_ph')}" value="${escapeHtml(state.ui.kpiSearchText||'')}" oninput="updateKpiSearchText(this.value)">
      </div>
      <div class="field" style="margin-bottom:0;">
        <label>${t('kpi_def_filter_label')}</label>
        <select class="input" onchange="state.ui.kpiDefFilter=this.value; renderPage();">
          <option value="">${t('all_kpi_defs')}</option>
          ${state.kpiDefinitions.map(d => `<option value="${d.id}" ${defFilter===d.id?'selected':''}>${escapeHtml(kpiDefName(d))}</option>`).join('')}
        </select>
      </div>
      <div class="field" style="margin-bottom:0; position:relative;">
        <label>${t('kpi_employee_filter_label')}</label>
        <button type="button" class="input" style="text-align:start; display:flex; align-items:center; justify-content:space-between; cursor:pointer;" onclick="toggleEmpFilterDropdown()">
          <span>${activeEmpNames.length ? (activeEmpNames.length<=2 ? escapeHtml(activeEmpNames.join('، ')) : activeEmpNames.length + ' ' + t('employees_selected')) : t('all_employees')}</span>
          <i class="fa-solid fa-chevron-down" style="font-size:11px;"></i>
        </button>
        <div id="empFilterDropdown" class="hidden card" style="position:absolute; top:100%; inset-inline-start:0; width:100%; max-height:220px; overflow-y:auto; z-index:15; margin-top:4px; padding:8px;">
          ${state.employees.map(e => `
            <label style="display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:8px; cursor:pointer; font-size:12.5px;" onmouseover="this.style.background='var(--bg-soft)'" onmouseout="this.style.background='transparent'">
              <input type="checkbox" ${empFilterSet.has(e.id)?'checked':''} onchange="toggleKpiEmployeeFilter('${e.id}')">
              <span class="avatar" style="width:22px;height:22px;font-size:9px;background:${avatarColor(e.id)};">${initials(e.name)}</span>
              ${escapeHtml(e.name)}

          ${empFilterSet.size ? `<button class="btn btn-ghost btn-sm" style="width:100%; justify-content:center; margin-top:4px;" onclick="clearKpiEmployeeFilter()"><i class="fa-solid fa-xmark"></i>${t('clear_filters')}</button>` : ''}
        </div>
      </div>
    </div>
  </div>

  <div class="panel" style="margin-bottom:14px;">
    <div class="panel-head"><h3><i class="fa-solid fa-filter"></i>${t('kpi_score_filter')}</h3></div>
    <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
      <select class="input" style="width:auto;" id="kpiFilterMode" onchange="updateKpiScoreFilterMode(this.value)">
        <option value="none" ${f.mode==='none'?'selected':''}>${t('kpi_filter_none')}</option>
        <option value="above" ${f.mode==='above'?'selected':''}>${t('kpi_filter_above')}</option>
        <option value="below" ${f.mode==='below'?'selected':''}>${t('kpi_filter_below')}</option>
        <option value="between" ${f.mode==='between'?'selected':''}>${t('kpi_filter_between')}</option>
      </select>
      ${f.mode==='above' || f.mode==='below' ? `
        <input class="input" style="width:90px;" type="number" min="0" max="10" step="0.1" value="${f.a ?? ''}" placeholder="${t('kpi_score')}" onchange="updateKpiScoreFilterValue('a', this.value)">
      ` : ''}
      ${f.mode==='between' ? `
        <input class="input" style="width:90px;" type="number" min="0" max="10" step="0.1" value="${f.a ?? ''}" placeholder="${t('from_value')}" onchange="updateKpiScoreFilterValue('a', this.value)">
        <span class="muted">—</span>
        <input class="input" style="width:90px;" type="number" min="0" max="10" step="0.1" value="${f.b ?? ''}" placeholder="${t('to_value')}" onchange="updateKpiScoreFilterValue('b', this.value)">
      ` : ''}
      ${f.mode!=='none' ? `<button class="btn btn-outline btn-sm" onclick="clearKpiScoreFilter()"><i class="fa-solid fa-xmark"></i>${t('clear_filters')}</button>
      <span class="badge badge-violet">${filteredData.length} ${state.lang==='ar'?'موظف مطابق':'employees matched'}</span>` : ''}
    </div>

  <div class="dash-grid" style="grid-template-columns:1fr 1fr;">
    <div class="panel">

    <div class="panel">

      <div style="max-height:230px; overflow-y:auto;">
      ${filteredData.length ? `<div class="kpi-list">${filteredData.map(d => {
        const lvl = performanceLevel(d.avg);
        return `
        <div class="kpi-item" style="cursor:pointer;" onclick="openEmployeeKpiModal('${d.e.id}')" title="${t('view_evaluations')}">
          <span class="avatar" style="background:${avatarColor(d.e.id)}">${initials(d.e.name)}</span>

          <span class="badge" style="background:${lvl.color}22; color:${lvl.color};">${t(lvl.key)}</span>
          <div class="ki-score" style="background:${kpiScoreColor(d.avg||0)}">${d.avg.toFixed(1)}</div>
        </div>`;}).join('')}</div>` : `<div class="empty-state"><i class="fa-solid fa-user-slash"></i>${t('no_employees')}</div>`}
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-head"><h3><i class="fa-solid fa-layer-group"></i>${t('kpi_levels_summary')}</h3></div>
    <div class="kpi-grid" style="grid-template-columns:repeat(4,1fr);">
      ${['perf_excellent','perf_good','perf_acceptable','perf_weak'].map(key => {
        const group = levelGroups[key];
        const lvl = {perf_excellent:'var(--emerald-600)', perf_good:'var(--emerald-400)', perf_acceptable:'var(--gold-500)', perf_weak:'var(--red-500)'}[key];
        return `<div class="kpi-card" style="--accent:${lvl}; cursor:pointer;" onclick="applyLevelFilter('${key}')">
          <div class="kpi-top">
            <div class="kpi-icon" style="background:${lvl}"><i class="fa-solid fa-star"></i></div>
          </div>

  ${renderKpiEvalTotalsSection(periodFilter)}

/* ---- Raw KPI-evaluation-level totals (each KPI grade, across every employee/task) ---- */
function collectAllKpiEvals(periodFilter){
  const evals = [];
  state.tasks.forEach(tk => (tk.kpis||[]).forEach(k => {
    if(periodFilter(k.date)) evals.push({...k, taskId: tk.id, taskTitle: tk.title, taskStatus: tk.status, employeeName: employeeName(k.employeeId)});
  }));
  return evals;
}
function applyKpiEvalScoreFilter(evals){
  const f = state.ui.kpiEvalScoreFilter || {mode:'none'};
  if(f.mode === 'none') return evals;
  return evals.filter(k => {
    if(f.mode === 'above') return k.score > (f.a ?? 0);
    if(f.mode === 'below') return k.score < (f.a ?? 10);
    if(f.mode === 'between') return k.score >= Math.min(f.a??0,f.b??10) && k.score <= Math.max(f.a??0,f.b??10);
    return true;
  });
}
function renderKpiEvalTotalsSection(periodFilter){
  const allEvals = collectAllKpiEvals(periodFilter);
  const levelGroups = {perf_excellent:[], perf_good:[], perf_acceptable:[], perf_weak:[]};
  allEvals.forEach(k => {
    const lvl = performanceLevel(k.score).key;
    if(levelGroups[lvl]) levelGroups[lvl].push(k);
  });
  const f = state.ui.kpiEvalScoreFilter || {mode:'none'};
  const filtered = applyKpiEvalScoreFilter(allEvals).sort((a,b)=>(b.date||'').localeCompare(a.date||''));

  return `
  <div class="panel" style="margin-top:14px;">
    <div class="panel-head"><h3><i class="fa-solid fa-square-poll-vertical"></i>${t('kpi_eval_totals')}</h3></div>
    <p class="field-hint" style="margin-bottom:14px;">${t('kpi_eval_totals_hint')}</p>

    <div class="kpi-grid" style="grid-template-columns:repeat(4,1fr); margin-bottom:16px;">
      ${['perf_excellent','perf_good','perf_acceptable','perf_weak'].map(key => {
        const group = levelGroups[key];
        const lvl = {perf_excellent:'var(--emerald-600)', perf_good:'var(--emerald-400)', perf_acceptable:'var(--gold-500)', perf_weak:'var(--red-500)'}[key];
        return `<div class="kpi-card" style="--accent:${lvl}; cursor:pointer;" onclick="applyEvalLevelFilter('${key}')">
          <div class="kpi-top">
            <div class="kpi-icon" style="background:${lvl}"><i class="fa-solid fa-clipboard-check"></i></div>
          </div>
          <div class="kpi-value">${group.length}</div>
          <div class="kpi-label">${t(key)}</div>
        </div>`;
      }).join('')}
    </div>

    <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:14px;">
      <select class="input" style="width:auto;" onchange="updateKpiEvalScoreFilterMode(this.value)">
        <option value="none" ${f.mode==='none'?'selected':''}>${t('kpi_filter_none')}</option>
        <option value="above" ${f.mode==='above'?'selected':''}>${t('kpi_filter_above')}</option>
        <option value="below" ${f.mode==='below'?'selected':''}>${t('kpi_filter_below')}</option>
        <option value="between" ${f.mode==='between'?'selected':''}>${t('kpi_filter_between')}</option>
      </select>
      ${f.mode==='above' || f.mode==='below' ? `
        <input class="input" style="width:90px;" type="number" min="1" max="10" step="1" value="${f.a ?? ''}" placeholder="${t('kpi_score')}" onchange="updateKpiEvalScoreFilterValue('a', this.value)">
      ` : ''}
      ${f.mode==='between' ? `
        <input class="input" style="width:90px;" type="number" min="1" max="10" step="1" value="${f.a ?? ''}" placeholder="${t('from_value')}" onchange="updateKpiEvalScoreFilterValue('a', this.value)">
        <span class="muted">—</span>
        <input class="input" style="width:90px;" type="number" min="1" max="10" step="1" value="${f.b ?? ''}" placeholder="${t('to_value')}" onchange="updateKpiEvalScoreFilterValue('b', this.value)">
      ` : ''}
      ${f.mode!=='none' ? `<button class="btn btn-outline btn-sm" onclick="clearKpiEvalScoreFilter()"><i class="fa-solid fa-xmark"></i>${t('clear_filters')}</button>
      <span class="badge badge-violet">${filtered.length} ${state.lang==='ar'?'مؤشر مطابق':'KPIs matched'}</span>` : ''}
    </div>

    <div style="max-height:320px; overflow-y:auto;">
      ${filtered.length ? `<div class="kpi-list">${filtered.map(k => `
        <div class="kpi-item" style="cursor:pointer; align-items:flex-start;" onclick="closeModal(); openTaskModal('${k.taskId}')">
          <div class="ki-score" style="background:${kpiScoreColor(k.score)}; flex-shrink:0;">${k.score}</div>
          <div style="flex:1; min-width:0;">
            <div class="ki-name">${escapeHtml(kpiEvalDisplayName(k))}</div>
            <div class="muted" style="font-size:11px; margin-top:2px; display:flex; align-items:center; gap:6px; flex-wrap:wrap;">
              <i class="fa-solid fa-user" style="font-size:9px;"></i>${escapeHtml(k.employeeName)}
              <i class="fa-solid fa-link" style="font-size:9px;"></i>${escapeHtml(k.taskTitle)}
              <span>· ${fmtDate(k.date)}</span>
            </div>
          </div>
          <span class="badge" style="background:${performanceLevel(k.score).color}22; color:${performanceLevel(k.score).color};">${t(performanceLevel(k.score).key)}</span>
        </div>`).join('')}</div>` : `<div class="empty-state"><i class="fa-solid fa-gauge-high"></i>${t('no_kpis_yet')}</div>`}
    </div>
  </div>`;
}
function updateKpiEvalScoreFilterMode(mode){
  state.ui.kpiEvalScoreFilter = {mode, a: state.ui.kpiEvalScoreFilter?.a, b: state.ui.kpiEvalScoreFilter?.b};
  renderPage();
}
function updateKpiEvalScoreFilterValue(key, val){
  if(!state.ui.kpiEvalScoreFilter) state.ui.kpiEvalScoreFilter = {mode:'above'};

/* ================================================================
   EXECUTIVE REPORT (single-page, share-ready for senior management)
   ================================================================ */
function computeExecutiveData(){
  const tasks = state.tasks;
  const total = tasks.length;
  const completed = tasks.filter(tk=>tk.status==='completed').length;
  const active = total - completed;
  const overdue = tasks.filter(isOverdue);
  const completionRate = total ? Math.round(completed/total*100) : 0;
  const statusCounts = {};
  STAGES.forEach(s => statusCounts[s] = 0);
  tasks.forEach(tk => { if(statusCounts[tk.status]!==undefined) statusCounts[tk.status]++; });
  const pendingCount = tasks.filter(tk => tk.isPending && tk.status!=='completed').length;

  // Overall average performance across all KPI evaluations
  const allScores = [];
  tasks.forEach(tk => (tk.kpis||[]).forEach(k => allScores.push(k.score)));
  const avgPerf = allScores.length ? allScores.reduce((a,b)=>a+b,0)/allScores.length : 0;

  // Critical items: overdue + upcoming due within 60 days, sorted soonest-first
  const critical = tasks.filter(tk => tk.status!=='completed' && tk.dueDate)
    .map(tk => ({tk, days: daysUntil(tk.dueDate)}))
    .filter(x => x.days <= 60)
    .sort((a,b)=>a.days-b.days);

  // Team snapshot: full ranked list of ALL employees + subsets for quick badges
  const empStats = state.employees.map(e => {
    const scores = [];
    tasks.forEach(tk => (tk.kpis||[]).forEach(k => { if(k.employeeId===e.id) scores.push(k.score); }));
    const avg = scores.length ? scores.reduce((a,b)=>a+b,0)/scores.length : 0;
    const empTasks = tasks.filter(tk => tk.assigneeId===e.id);
    const completedCount = empTasks.filter(tk=>tk.status==='completed').length;
    const overdueCount = empTasks.filter(isOverdue).length;
    return {e, avg, evalCount: scores.length, taskCount: empTasks.length, completedCount, overdueCount};
  });
  const teamRanked = [...empStats].sort((a,b)=> b.avg - a.avg || b.completedCount - a.completedCount);
  const topTeam = [...empStats].filter(s=>s.evalCount>0).sort((a,b)=>b.avg-a.avg).slice(0,3);
  const needsAttention = [...empStats].filter(s => s.overdueCount>0 || (s.evalCount>0 && s.avg<4))
    .sort((a,b)=> (b.overdueCount - a.overdueCount) || (a.avg-b.avg)).slice(0,3);

  // Task nature: priority breakdown + avg completion work-days per priority
  const priorityOrder = ['urgent','high','medium','low'];
  const priorityCounts = {urgent:0, high:0, medium:0, low:0};
  tasks.forEach(tk => { if(priorityCounts[tk.priority]!==undefined) priorityCounts[tk.priority]++; });
  const priorityAvgDays = {};
  priorityOrder.forEach(p => {
    const done = tasks.filter(tk => tk.priority===p && tk.status==='completed' && tk.completedDate);
    const days = done.map(tk => calcWorkDays(tk.startDate, tk.completedDate));
    priorityAvgDays[p] = days.length ? (days.reduce((a,b)=>a+b,0)/days.length) : null;
  });

  // 6-month trend
  const months = [];
  const now = new Date();
  for(let i=5;i>=0;i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    months.push({y:d.getFullYear(), m:d.getMonth(), label: d.toLocaleDateString(state.lang==='ar'?'ar-EG':'en-GB',{month:'short'})});
  }
  const createdCounts = months.map(mo => tasks.filter(tk => { const d=new Date(tk.createdAt); return d.getFullYear()===mo.y && d.getMonth()===mo.m; }).length);
  const completedCounts = months.map(mo => tasks.filter(tk => { if(!tk.completedDate) return false; const d=new Date(tk.completedDate+'T00:00:00'); return d.getFullYear()===mo.y && d.getMonth()===mo.m; }).length);

  // Health narrative
  const overdueRatio = total ? overdue.length/total : 0;
  let health = 'exec_health_excellent';
  if(overdueRatio > 0.35 || (allScores.length && avgPerf < 4)) health = 'exec_health_critical';
  else if(overdueRatio > 0.18 || (allScores.length && avgPerf < 6)) health = 'exec_health_warn';
  else if(overdueRatio > 0.05 || (allScores.length && avgPerf < 8)) health = 'exec_health_good';

  return {total, completed, active, overdue, completionRate, statusCounts, pendingCount, avgPerf, critical, topTeam, needsAttention, teamRanked, priorityCounts, priorityAvgDays, months, createdCounts, completedCounts, health};
}

function avatarColorHex(seed){
  const colors = ['#12876B','#5B3E8C','#D4A017','#1E3565','#D4453D','#0A5747'];
  let hash = 0;
  for(let i=0;i<String(seed).length;i++) hash = String(seed).charCodeAt(i) + ((hash<<5)-hash);
  return colors[Math.abs(hash) % colors.length];
}

const PRIORITY_TEXT_MAP = {'منخفضة':'low','متوسطة':'medium','عالية':'high','عاجلة':'urgent','low':'low','medium':'medium','high':'high','urgent':'urgent'};
const STATUS_TEXT_MAP = {
  'الاستلام':'receiving','التجهيز':'preparation','التقديم':'submission','المتابعة':'followup','الرد':'response','الإنجاز':'completed','مكتمل':'completed',
  'receiving':'receiving','preparation':'preparation','submission':'submission','follow-up':'followup','followup':'followup','response':'response','completed':'completed',
  // legacy values from the previous 4-stage scheme, kept for backward-compatible Excel imports
  'تكليف':'receiving','تنفيذ':'preparation','مراجعة':'response','assigned':'receiving','in progress':'preparation','inprogress':'preparation','review':'response'
};
function excelDateToISO(val){
  if(!val) return '';
  if(typeof val === 'string'){
    const m = val.match(/^\d{4}-\d{2}-\d{2}/);
    if(m) return m[0];
    const d = new Date(val);
    if(!isNaN(d)) return d.toISOString().slice(0,10);
    return '';
  }
  if(typeof val === 'number'){
    // Excel serial date
    const d = XLSX.SSF.parse_date_code(val);
    if(d) return `${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`;
  }
  if(val instanceof Date) return val.toISOString().slice(0,10);
  return '';
}

    }
    const rawPriority = (r[t('col_priority')] || r['Priority'] || r['الأولوية'] || '').toString().trim().toLowerCase();
    const rawStatus = (r[t('col_status')] || r['Status'] || r['الحالة'] || '').toString().trim().toLowerCase();
    const priority = PRIORITY_TEXT_MAP[rawPriority] || 'medium';
    const status = STATUS_TEXT_MAP[rawStatus] || 'receiving';
    const startDate = excelDateToISO(r[t('col_start')] || r['StartDate'] || r['تاريخ البدء']) || todayISO();
    const dueDate = excelDateToISO(r[t('col_due')] || r['DueDate'] || r['تاريخ الاستحقاق']);
    const tk = {
      id: uid('task'), title: String(title).trim(), description: r[t('task_desc')]||r['Description']||r['الوصف']||'',
      assigneeId: emp ? emp.id : '', priority, status:'receiving', isPending:false, pendingReason:'', pendingSince:null,
      startDate, dueDate, completedDate:null, stageDates:{receiving: startDate}, kpis:[], comments:[], createdAt: Date.now()
    };
    if(status !== 'receiving') updateTaskStageDates(tk, status);
    created.push(tk);
  });
  return created;
}

/* ================================================================
   NOTIFICATIONS (Browser Notification API)
   ================================================================ */
function requestNotifPermission(){
  if(!('Notification' in window)){ toast(t('notif_denied'), 'warn'); return; }
  Notification.requestPermission().then(perm => {
    if(perm === 'granted') toast(t('notif_enabled'));
    else toast(t('notif_denied'), 'warn');
  });
}
function checkAndNotify(tk){
  if(!('Notification' in window) || Notification.permission !== 'granted') return;
  if(tk.dueDate){
    const days = daysUntil(tk.dueDate);
    if(days <= 1){
      new Notification('Done', {body: `${tk.title} — ${t('due_in')} ${days} ${t('days_left')}`});
    }
  }
}
function scanOverdueAndNotify(){
  if(!('Notification' in window) || Notification.permission !== 'granted') return;
  const overdue = state.tasks.filter(isOverdue);
  const dot = document.getElementById('notifDot');
  if(overdue.length){ dot.classList.remove('hidden'); }
  else { dot.classList.add('hidden'); }
}
function toggleNotifPanel(){
  if(!('Notification' in window)){ toast(t('notif_denied'), 'warn'); return; }
  if(Notification.permission === 'default'){ requestNotifPermission(); return; }
  const overdue = state.tasks.filter(isOverdue);
  const upcoming = state.tasks.filter(tk => tk.status!=='completed' && tk.dueDate && daysUntil(tk.dueDate)>=0 && daysUntil(tk.dueDate)<=2);
  if(overdue.length===0 && upcoming.length===0){ toast(t('no_alerts')); return; }
  goPage('dashboard');
}

/* ================================================================
   CLOUD SYNC (JSONBin) — hardcoded, zero-setup, auto-starts on load
   ================================================================ */
const JSONBIN_API_KEY = "$2a$10$GTvoO0aebCtEM8WG9jBNUOmUeydtCaEjpvTQxDTL9mGZUUwsuDwSy";
const JSONBIN_BIN_ID = "6a9897ceda38895dfe314e7b";
const JSONBIN_BASE_URL = "https://api.jsonbin.io/v3";
const SYNC_POLL_MS = 4000;
let syncTimer = null;
let syncInFlight = false;
let syncPushDebounce = null;
let syncLastKnownVersion = null; // updatedAt timestamp we last applied/pushed
let syncHoldUntil = 0; // while Date.now() < this, skip applying pulled data (protects unpushed local edits)

function isSyncEnabled(){ return true; } // hardcoded credentials — sync is always on
function syncHeaders(){
  return {'Content-Type':'application/json', 'X-Master-Key': JSONBIN_API_KEY};
}
function setSyncStatus(status){
  // status: 'offline' | 'connected' | 'syncing' | 'error'
  const icon = document.getElementById('syncStatusIcon');
  const text = document.getElementById('syncStatusText');
  const btn = document.getElementById('syncStatusBtn');
  if(!icon || !text || !btn) return;
  btn.classList.remove('sync-ok','sync-busy','sync-err');
  if(status === 'connected'){
    icon.className = 'fa-solid fa-cloud-arrow-up';
    text.textContent = t('sync_connected');
    btn.classList.add('sync-ok');
  } else if(status === 'syncing'){
    icon.className = 'fa-solid fa-arrows-rotate fa-spin';
    text.textContent = t('sync_syncing');
    btn.classList.add('sync-busy');
  } else if(status === 'error'){
    icon.className = 'fa-solid fa-triangle-exclamation';
    text.textContent = t('sync_error');
    btn.classList.add('sync-err');
  } else {
    icon.className = 'fa-solid fa-cloud';
    text.textContent = t('sync_offline');
  }
}
function currentSyncPayload(){
  return {
    tasks: state.tasks, employees: state.employees, kpiDefinitions: state.kpiDefinitions,
    taskCategories: state.taskCategories, employeeUsers: state.employeeUsers,
    weekendDays: state.weekendDays, stageDurations: state.stageDurations,
    updatedAt: Date.now()
  };
}
async function syncPull(silent){
  if(!silent) setSyncStatus('syncing');
  try{
    const res = await fetch(`${JSONBIN_BASE_URL}/b/${JSONBIN_BIN_ID}/latest`, {
      headers: syncHeaders()
    });
    if(!res.ok) throw new Error('http_'+res.status);
    const json = await res.json();
    setSyncStatus('connected');
    return json.record || null;
  }catch(e){
    console.error('Sync pull error', e);
    setSyncStatus('error');
    return null;
  }
}
async function syncPush(){
  setSyncStatus('syncing');
  try{
    const payload = currentSyncPayload();
    const res = await fetch(`${JSONBIN_BASE_URL}/b/${JSONBIN_BIN_ID}`, {
      method: 'PUT',
      headers: syncHeaders(),
      body: JSON.stringify(payload)
    });
    if(!res.ok) throw new Error('http_'+res.status);
    syncLastKnownVersion = payload.updatedAt;
    setSyncStatus('connected');
    return true;
  }catch(e){
    console.error('Sync push error', e);
    setSyncStatus('error');
    return false;
  }
}
function applyRemoteRecord(record){
  if(!record) return;
  state.tasks = record.tasks || [];
  state.employees = record.employees || [];
  state.kpiDefinitions = (record.kpiDefinitions && record.kpiDefinitions.length) ? record.kpiDefinitions : DEFAULT_KPI_DEFS.slice();
  state.taskCategories = (record.taskCategories && record.taskCategories.length) ? record.taskCategories : DEFAULT_TASK_CATEGORIES.slice();
  state.employeeUsers = record.employeeUsers || [];
  if(record.weekendDays) state.weekendDays = record.weekendDays;
  if(record.stageDurations) state.stageDurations = Object.assign({}, STAGE_DURATION_DAYS, record.stageDurations);
  syncLastKnownVersion = record.updatedAt || Date.now();
  // Persist locally too, so an offline reload still has the latest synced data
  localStorage.setItem(STORAGE_KEY, JSON.stringify({tasks: state.tasks, employees: state.employees, kpiDefinitions: state.kpiDefinitions, taskCategories: state.taskCategories, employeeUsers: state.employeeUsers}));
  renderPage();
}
async function syncPoll(){
  if(syncInFlight) return;
  if(Date.now() < syncHoldUntil) return; // a local edit hasn't been pushed yet — don't let a stale pull clobber it
  syncInFlight = true;
  try{
    const record = await syncPull(true);
    if(record && record.updatedAt && record.updatedAt !== syncLastKnownVersion && Date.now() >= syncHoldUntil){
      applyRemoteRecord(record);
    }
  } finally {
    syncInFlight = false;
  }
}
function startSyncPolling(){
  if(syncTimer) clearInterval(syncTimer);
  syncTimer = setInterval(syncPoll, SYNC_POLL_MS);
}
function requestSyncPush(){
  // Debounced push after any local data change, so rapid edits collapse into one request
  syncHoldUntil = Date.now() + 3000; // protect this edit from being overwritten by a poll until it's pushed
  if(syncPushDebounce) clearTimeout(syncPushDebounce);
  syncPushDebounce = setTimeout(() => { syncPush(); }, 900);
}
function forceSyncPushNow(){
  // For actions where we want the push to happen immediately rather than waiting for the debounce
  // (e.g. restoring a backup) — still protected by the hold window set below.
  syncHoldUntil = Date.now() + 4000;
  if(syncPushDebounce){ clearTimeout(syncPushDebounce); syncPushDebounce = null; }
  syncPush();
}
async function syncPullWithRetry(attempts){
  for(let i=0; i<attempts; i++){
    const record = await syncPull(true);
    if(record !== null) return record; // got a real answer (could be {} or real data)
    if(i < attempts-1) await new Promise(r => setTimeout(r, 1000 * (i+1)));
  }
  return null; // genuinely unreachable after retries
}
function recordHasData(record){
  if(!record) return false;
  return !!(record.updatedAt || (record.tasks && record.tasks.length) || (record.employees && record.employees.length));
}
async function initSyncOnLoad(){
  setSyncStatus('syncing');
  const record = await syncPullWithRetry(3);
  if(record === null){
    // Could not reach the bin after retries — keep local data untouched, never push automatically.
    // Polling will keep trying in the background; nothing is overwritten based on a failed read.
    setSyncStatus('error');
    startSyncPolling();
    return;
  }
  if(recordHasData(record)){
    // Cloud has real data — it's the shared source of truth for the team on open
    applyRemoteRecord(record);
  } else {
    // Confirmed (not just a single failed request) that the bin is genuinely empty/new — safe to seed it
    await syncPush();
  }
  startSyncPolling();
}

  }

    setTimeout(() => { if(confirm(t('notif_enable')+'?')) requestNotifPermission(); }, 1200);
  }
  setSyncStatus('offline');
  initSyncOnLoad();
}
