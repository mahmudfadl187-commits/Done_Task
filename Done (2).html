<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Done — إدارة المهام والفرق</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* ============ Done DESIGN TOKENS ============ */
:root{
  --navy-950:#0A1330;
  --navy-900:#0F1B3C;
  --navy-800:#152650;
  --navy-700:#1E3565;
  --navy-600:#2B4680;
  --emerald-700:#0A5747;
  --emerald-600:#0E6E5A;
  --emerald-500:#12876B;
  --emerald-400:#1FA987;
  --violet-700:#432D6B;
  --violet-600:#5B3E8C;
  --violet-500:#7355AC;
  --gold-600:#B3860E;
  --gold-500:#D4A017;
  --gold-400:#E5BB3F;
  --red-600:#B3332C;
  --red-500:#D4453D;
  --bg-app:#F5F6FA;
  --bg-card:#FFFFFF;
  --bg-soft:#EEF0F7;
  --ink-900:#131A2E;
  --ink-700:#3B4562;
  --ink-500:#6B7392;
  --ink-300:#A6ACC4;
  --line:#E3E6F0;
  --line-soft:#EDEFF6;
  --shadow-sm:0 1px 2px rgba(15,27,60,.06), 0 1px 1px rgba(15,27,60,.04);
  --shadow-md:0 4px 16px rgba(15,27,60,.08), 0 2px 6px rgba(15,27,60,.05);
  --shadow-lg:0 12px 32px rgba(15,27,60,.14), 0 4px 12px rgba(15,27,60,.08);
  --radius-sm:8px;
  --radius-md:14px;
  --radius-lg:20px;
  --font-ar:'Tajawal', sans-serif;
  --font-en:'Inter', sans-serif;
}
[data-theme="dark"]{
  --bg-app:#0A1024;
  --bg-card:#111A34;
  --bg-soft:#16224A;
  --ink-900:#F1F3FA;
  --ink-700:#C7CCE2;
  --ink-500:#8D94B8;
  --ink-300:#565F84;
  --line:#233058;
  --line-soft:#1B2748;
  --shadow-sm:0 1px 2px rgba(0,0,0,.3);
  --shadow-md:0 4px 16px rgba(0,0,0,.35);
  --shadow-lg:0 12px 32px rgba(0,0,0,.45);
}
*{box-sizing:border-box; margin:0; padding:0;}
html{scroll-behavior:smooth;}
body{
  font-family:var(--font-ar);
  background:var(--bg-app);
  color:var(--ink-900);
  min-height:100vh;
  transition:background .3s ease,color .3s ease;
  font-size:15px;
  line-height:1.6;
}
html[dir="ltr"] body{font-family:var(--font-en);}
::selection{background:var(--emerald-400); color:#fff;}
::-webkit-scrollbar{width:10px; height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--ink-300); border-radius:10px;}
::-webkit-scrollbar-thumb:hover{background:var(--ink-500);}
a{color:inherit; text-decoration:none;}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit;}
:focus-visible{outline:2px solid var(--gold-500); outline-offset:2px;}

/* ============ APP SHELL ============ */
.app-shell{display:flex; min-height:100vh;}

/* ---- SIDEBAR ---- */
.sidebar{
  width:264px; flex-shrink:0;
  background:linear-gradient(180deg, var(--navy-900), var(--navy-950));
  color:#fff;
  display:flex; flex-direction:column;
  position:sticky; top:0; height:100vh; overflow-y:auto;
  z-index:40;
  transition:transform .25s ease;
}
.brand{
  display:flex; align-items:center; gap:12px;
  padding:22px 20px 18px;
  border-bottom:1px solid rgba(255,255,255,.08);
}
.brand-mark{
  width:42px; height:42px; border-radius:12px;
  background:linear-gradient(135deg, var(--emerald-500), var(--violet-600));
  display:flex; align-items:center; justify-content:center;
  font-weight:900; font-size:18px; color:#fff;
  box-shadow:var(--shadow-md);
  flex-shrink:0;
  font-family:var(--font-en);
}
.brand-text{display:flex; flex-direction:column; line-height:1.2;}
.brand-text b{font-size:19px; font-weight:800; letter-spacing:.5px; font-family:var(--font-en);}
.brand-text span{font-size:11.5px; color:var(--gold-400); font-weight:600; letter-spacing:.3px;}

.nav-group{padding:14px 12px;}
.nav-label{
  font-size:11px; color:rgba(255,255,255,.35); font-weight:700;
  text-transform:uppercase; letter-spacing:1px;
  padding:10px 12px 6px;
}
.nav-item{
  display:flex; align-items:center; gap:12px;
  padding:11px 14px; border-radius:11px;
  color:rgba(255,255,255,.7); font-weight:600; font-size:14.5px;
  cursor:pointer; margin-bottom:2px; position:relative;
  transition:background .15s ease, color .15s ease;
  border:none; background:transparent; width:100%; text-align:inherit;
}
.nav-item i{width:20px; text-align:center; font-size:16px; flex-shrink:0;}
.nav-item:hover{background:rgba(255,255,255,.06); color:#fff;}
.nav-item.active{
  background:linear-gradient(90deg, rgba(18,135,107,.35), rgba(91,62,140,.25));
  color:#fff;
}
.nav-item.active::before{
  content:''; position:absolute; inset-inline-start:0; top:6px; bottom:6px; width:3px;
  background:linear-gradient(180deg, var(--emerald-400), var(--gold-400));
  border-radius:4px;
}
#syncStatusBtn.sync-ok{color:#6ee7b7;}
#syncStatusBtn.sync-ok i{color:#34d399;}
#syncStatusBtn.sync-busy{color:#93c5fd;}
#syncStatusBtn.sync-busy i{color:#60a5fa;}
#syncStatusBtn.sync-err{color:#fca5a5;}
#syncStatusBtn.sync-err i{color:#f87171;}
.nav-badge{
  margin-inline-start:auto; background:var(--red-500); color:#fff;
  font-size:10.5px; font-weight:800; padding:1px 7px; border-radius:20px;
  font-family:var(--font-en);
}
.sidebar-footer{
  margin-top:auto; padding:16px; border-top:1px solid rgba(255,255,255,.08);
  display:flex; flex-direction:column; gap:8px;
}
.sidebar-btn{
  display:flex; align-items:center; gap:10px; padding:9px 12px;
  border-radius:10px; background:rgba(255,255,255,.06); color:rgba(255,255,255,.8);
  border:none; font-size:13px; font-weight:600; width:100%;
  transition:background .15s;
}
.sidebar-btn:hover{background:rgba(255,255,255,.12); color:#fff;}

/* ---- MAIN ---- */
.main{flex:1; min-width:0; display:flex; flex-direction:column;}
.topbar{
  position:sticky; top:0; z-index:30;
  background:var(--bg-card); border-bottom:1px solid var(--line);
  padding:14px 26px; display:flex; align-items:center; gap:14px;
  box-shadow:var(--shadow-sm);
}
.menu-toggle{
  display:none; background:none; border:none; font-size:20px; color:var(--ink-700);
  padding:6px;
}
.page-title{font-size:20px; font-weight:800; display:flex; align-items:center; gap:10px;}
.page-title i{color:var(--emerald-600);}
.topbar-spacer{flex:1;}
.topbar-search{
  position:relative; width:260px; max-width:40vw;
}
.topbar-search input{
  width:100%; padding:9px 14px; padding-inline-start:36px;
  border:1.5px solid var(--line); border-radius:10px; background:var(--bg-soft);
  font-size:13.5px; color:var(--ink-900);
}
.topbar-search i{position:absolute; inset-inline-start:12px; top:50%; transform:translateY(-50%); color:var(--ink-300); font-size:13px;}
.icon-btn{
  width:38px; height:38px; border-radius:10px; border:1.5px solid var(--line);
  background:var(--bg-card); display:flex; align-items:center; justify-content:center;
  color:var(--ink-700); font-size:15px; position:relative; flex-shrink:0;
  transition:all .15s;
}
.icon-btn:hover{background:var(--bg-soft); border-color:var(--ink-300);}
.icon-btn .dot{
  position:absolute; top:-3px; inset-inline-end:-3px; width:9px; height:9px; border-radius:50%;
  background:var(--red-500); border:2px solid var(--bg-card);
}
.lang-pill{
  display:flex; border:1.5px solid var(--line); border-radius:10px; overflow:hidden; flex-shrink:0;
}
.lang-pill button{
  padding:8px 12px; border:none; background:var(--bg-card); color:var(--ink-500);
  font-size:12.5px; font-weight:700; font-family:var(--font-en);
}
.lang-pill button.active{background:var(--navy-900); color:#fff;}

.content{padding:18px 24px 40px; flex:1;}

/* ============ SHARED COMPONENTS ============ */
.card{
  background:var(--bg-card); border:1px solid var(--line); border-radius:var(--radius-md);
  box-shadow:var(--shadow-sm);
}
.btn{
  display:inline-flex; align-items:center; gap:8px; padding:10px 18px;
  border-radius:10px; border:none; font-weight:700; font-size:13.5px;
  transition:all .15s ease; white-space:nowrap;
}
.btn i{font-size:13px;}
.btn-primary{background:linear-gradient(135deg, var(--emerald-600), var(--emerald-700)); color:#fff; box-shadow:var(--shadow-sm);}
.btn-primary:hover{filter:brightness(1.08); box-shadow:var(--shadow-md); transform:translateY(-1px);}
.btn-violet{background:linear-gradient(135deg, var(--violet-600), var(--violet-700)); color:#fff;}
.btn-violet:hover{filter:brightness(1.08); transform:translateY(-1px);}
.btn-gold{background:linear-gradient(135deg, var(--gold-500), var(--gold-600)); color:#fff;}
.btn-gold:hover{filter:brightness(1.08); transform:translateY(-1px);}
.btn-outline{background:var(--bg-card); border:1.5px solid var(--line); color:var(--ink-700);}
.btn-outline:hover{background:var(--bg-soft); border-color:var(--ink-300);}
.btn-danger{background:linear-gradient(135deg, var(--red-500), var(--red-600)); color:#fff;}
.btn-danger:hover{filter:brightness(1.08);}
.btn-ghost{background:transparent; border:none; color:var(--ink-500); padding:8px 12px;}
.btn-ghost:hover{color:var(--ink-900); background:var(--bg-soft); border-radius:8px;}
.btn-sm{padding:7px 12px; font-size:12.5px; border-radius:8px;}
.btn:disabled{opacity:.5; cursor:not-allowed; transform:none !important;}

.badge{
  display:inline-flex; align-items:center; gap:5px; padding:4px 10px;
  border-radius:20px; font-size:11.5px; font-weight:800;
}
.badge-dot{width:6px; height:6px; border-radius:50%; flex-shrink:0;}
.badge-navy{background:rgba(30,53,101,.12); color:var(--navy-700);}
[data-theme="dark"] .badge-navy{background:rgba(90,120,200,.18); color:#A9BCEF;}
.badge-emerald{background:rgba(14,110,90,.12); color:var(--emerald-700);}
[data-theme="dark"] .badge-emerald{background:rgba(31,169,135,.18); color:#5FD9B7;}
.badge-violet{background:rgba(91,62,140,.12); color:var(--violet-700);}
[data-theme="dark"] .badge-violet{background:rgba(115,85,172,.2); color:#C6AEEA;}
.badge-gold{background:rgba(212,160,23,.14); color:var(--gold-600);}
[data-theme="dark"] .badge-gold{background:rgba(229,187,63,.18); color:#F0CE73;}
.badge-red{background:rgba(212,69,61,.12); color:var(--red-600);}
[data-theme="dark"] .badge-red{background:rgba(212,69,61,.2); color:#F19891;}
.badge-gray{background:var(--bg-soft); color:var(--ink-500);}

.input, select.input, textarea.input{
  width:100%; padding:10px 13px; border:1.5px solid var(--line); border-radius:10px;
  background:var(--bg-card); color:var(--ink-900); font-size:13.5px;
  transition:border-color .15s;
}
.input:focus, select.input:focus, textarea.input:focus{border-color:var(--emerald-500); outline:none;}
.field{display:flex; flex-direction:column; gap:6px; margin-bottom:14px;}
.field label{font-size:12.5px; font-weight:700; color:var(--ink-700);}
.field-hint{font-size:11px; color:var(--ink-300);}
.field-row{display:grid; grid-template-columns:1fr 1fr; gap:14px;}

.section-title{font-size:16px; font-weight:800; margin-bottom:14px; display:flex; align-items:center; gap:8px;}
.section-title i{color:var(--violet-600); font-size:14px;}
.muted{color:var(--ink-500);}
.hidden{display:none !important;}

/* ---- Modal ---- */
.modal-overlay{
  position:fixed; inset:0; background:rgba(10,16,36,.55); backdrop-filter:blur(3px);
  display:flex; align-items:center; justify-content:center; z-index:200; padding:20px;
  animation:fadeIn .15s ease;
}
@keyframes fadeIn{from{opacity:0} to{opacity:1}}
.modal{
  background:var(--bg-card); border-radius:var(--radius-lg); box-shadow:var(--shadow-lg);
  width:100%; max-width:560px; max-height:88vh; overflow-y:auto;
  animation:slideUp .2s ease;
  border:1px solid var(--line);
}
.modal.modal-wide{max-width:820px;}
@keyframes slideUp{from{opacity:0; transform:translateY(16px) scale(.98)} to{opacity:1; transform:translateY(0) scale(1)}}
.modal-head{
  padding:18px 22px; border-bottom:1px solid var(--line); display:flex; align-items:center;
  gap:12px; position:sticky; top:0; background:var(--bg-card); z-index:5; border-radius:var(--radius-lg) var(--radius-lg) 0 0;
}
.modal-head h3{font-size:17px; font-weight:800; flex:1;}
.modal-close{background:var(--bg-soft); border:none; width:32px; height:32px; border-radius:9px; color:var(--ink-500); font-size:15px;}
.modal-close:hover{background:var(--red-500); color:#fff;}
.modal-body{padding:20px 22px;}
.modal-foot{padding:16px 22px; border-top:1px solid var(--line); display:flex; justify-content:flex-end; gap:10px; position:sticky; bottom:0; background:var(--bg-card); border-radius:0 0 var(--radius-lg) var(--radius-lg);}

/* ---- Toast ---- */
.toast-wrap{position:fixed; bottom:22px; inset-inline-end:22px; z-index:400; display:flex; flex-direction:column; gap:10px;}
.toast{
  background:var(--navy-900); color:#fff; padding:13px 18px; border-radius:12px;
  box-shadow:var(--shadow-lg); display:flex; align-items:center; gap:10px; font-size:13.5px; font-weight:600;
  min-width:240px; animation:toastIn .25s ease;
  border-inline-start:4px solid var(--emerald-500);
}
.toast.err{border-inline-start-color:var(--red-500);}
.toast.warn{border-inline-start-color:var(--gold-500);}
@keyframes toastIn{from{opacity:0; transform:translateX(0) translateY(10px)} to{opacity:1; transform:translateY(0)}}

/* ============ PAGE: DASHBOARD ============ */
.kpi-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:14px;}
.kpi-grid.cols-5{grid-template-columns:repeat(5,1fr);}
.kpi-card{
  background:var(--bg-card); border:1px solid var(--line); border-radius:var(--radius-md);
  padding:13px 15px; position:relative; overflow:hidden; box-shadow:var(--shadow-sm);
  transition:transform .18s ease, box-shadow .18s ease; cursor:default;
}
.kpi-card:hover{transform:translateY(-2px); box-shadow:var(--shadow-md);}
.kpi-card-clickable:hover{border-color:var(--emerald-400);}
.kpi-card::after{
  content:''; position:absolute; inset-inline-end:-26px; top:-26px; width:80px; height:80px;
  border-radius:50%; opacity:.08; background:var(--accent, var(--emerald-500));
}
.kpi-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:7px;}
.kpi-icon{
  width:32px; height:32px; border-radius:9px; display:flex; align-items:center; justify-content:center;
  background:var(--accent, var(--emerald-500)); color:#fff; font-size:13px;
}
.kpi-trend{font-size:11px; font-weight:800; display:flex; align-items:center; gap:3px;}
.kpi-trend.up{color:var(--emerald-600);}
.kpi-trend.down{color:var(--red-600);}
.kpi-value{font-size:24px; font-weight:900; font-family:var(--font-en); line-height:1;}
.kpi-label{font-size:11.5px; color:var(--ink-500); font-weight:600; margin-top:4px;}

.dash-grid{display:grid; grid-template-columns:1.3fr 1fr; gap:14px; margin-bottom:14px;}
.dash-grid-3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px; margin-bottom:14px;}
.dash-grid-2{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:14px;}
.panel{background:var(--bg-card); border:1px solid var(--line); border-radius:var(--radius-md); padding:15px 16px; box-shadow:var(--shadow-sm);}
.panel canvas{max-height:200px;}
.chart-clickable{cursor:pointer; border-radius:10px; transition:background .15s ease; position:relative;}
.chart-clickable:hover{background:var(--bg-soft);}
.chart-clickable::after{
  content:'\f065'; font-family:'Font Awesome 6 Free'; font-weight:900; position:absolute; top:6px; inset-inline-end:6px;
  font-size:11px; color:var(--ink-300); opacity:0; transition:opacity .15s ease;
}
.chart-clickable:hover::after{opacity:1;}
.decision-row{display:flex; align-items:flex-start; gap:10px; padding:10px 12px; border-radius:10px; border:1px solid var(--line-soft); margin-bottom:8px;}
.decision-row .d-ico{width:30px; height:30px; border-radius:9px; display:flex; align-items:center; justify-content:center; flex-shrink:0; color:#fff; font-size:12px;}
.decision-row .d-text{font-size:12px; line-height:1.6;}
.decision-row .d-text b{font-weight:800;}
.panel-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
.panel-head h3{font-size:15px; font-weight:800; display:flex; align-items:center; gap:8px;}
.panel-head h3 i{color:var(--violet-600);}

.alert-row{
  display:flex; align-items:center; gap:12px; padding:11px 12px; border-radius:10px;
  border:1px solid var(--line-soft); margin-bottom:8px; transition:background .15s; cursor:pointer;
}
.alert-row:hover{background:var(--bg-soft);}
.alert-row .a-ico{width:34px; height:34px; border-radius:9px; display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:14px;}
.alert-row .a-body{flex:1; min-width:0;}
.alert-row .a-title{font-size:13px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.alert-row .a-sub{font-size:11.5px; color:var(--ink-500);}
.empty-state{text-align:center; padding:34px 16px; color:var(--ink-300);}
.empty-state i{font-size:32px; margin-bottom:10px; display:block;}

.compare-bars{display:flex; flex-direction:column; gap:14px;}
.compare-row{display:flex; align-items:center; gap:12px;}
.compare-label{width:82px; font-size:12.5px; font-weight:700; color:var(--ink-500); flex-shrink:0;}
.compare-track{flex:1; height:26px; background:var(--bg-soft); border-radius:8px; overflow:hidden; position:relative;}
.compare-fill{height:100%; border-radius:8px; display:flex; align-items:center; padding:0 10px; color:#fff; font-size:11.5px; font-weight:800; font-family:var(--font-en); transition:width .6s cubic-bezier(.4,0,.2,1);}

/* ============ TASK CARDS ============ */
.toolbar{
  display:flex; align-items:center; gap:10px; margin-bottom:18px; flex-wrap:wrap;
}
.toolbar .grow{flex:1; min-width:180px;}
.view-toggle{display:flex; border:1.5px solid var(--line); border-radius:10px; overflow:hidden;}
.view-toggle button{padding:9px 13px; background:var(--bg-card); border:none; color:var(--ink-500); font-size:14px;}
.view-toggle button.active{background:var(--navy-900); color:#fff;}

.filter-bar{
  display:grid; grid-template-columns:repeat(6,1fr) auto auto; gap:10px; margin-bottom:16px;
  background:var(--bg-card); border:1px solid var(--line); border-radius:var(--radius-md); padding:14px; box-shadow:var(--shadow-sm);
}
.filter-bar select, .filter-bar input{padding:8px 10px; font-size:12.5px;}

.task-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(340px,1fr)); gap:16px;}
.task-card{
  background:var(--bg-card); border:1px solid var(--line); border-radius:var(--radius-md);
  padding:18px; box-shadow:var(--shadow-sm); transition:transform .15s ease, box-shadow .15s ease;
  position:relative; display:flex; flex-direction:column; gap:12px;
}
.task-card:hover{transform:translateY(-2px); box-shadow:var(--shadow-md);}
.task-card.selected{outline:2px solid var(--emerald-500); outline-offset:-1px;}
.tc-top{display:flex; align-items:flex-start; gap:10px;}
.tc-check{margin-top:3px; width:17px; height:17px; accent-color:var(--emerald-600); flex-shrink:0; cursor:pointer;}
.tc-titlewrap{flex:1; min-width:0;}
.tc-title{font-size:16px; font-weight:800; line-height:1.35; margin-bottom:4px;}
.tc-desc{font-size:12.5px; color:var(--ink-500); line-height:1.6; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
.tc-badges{display:flex; gap:6px; flex-wrap:wrap;}
.tc-meta{display:flex; flex-wrap:wrap; gap:8px; font-size:11.5px; color:var(--ink-500);}
.tc-meta span{display:flex; align-items:center; gap:5px;}
.tc-meta i{color:var(--ink-300); font-size:11px;}
.tc-meta.overdue{color:var(--red-600); font-weight:700;}
.tc-meta.overdue i{color:var(--red-500);}

.stage-track{display:flex; align-items:flex-start; gap:0; margin:4px 0 2px;}
.stage-seg{flex:1; display:flex; flex-direction:column; align-items:center; position:relative; min-width:0;}
.stage-dot{
  width:18px; height:18px; border-radius:50%; background:var(--bg-soft); border:2px solid var(--line);
  display:flex; align-items:center; justify-content:center; font-size:8.5px; color:var(--ink-300); z-index:2;
  transition:all .25s; flex-shrink:0;
}
.stage-seg.done .stage-dot{background:var(--emerald-500); border-color:var(--emerald-500); color:#fff;}
.stage-seg.current .stage-dot{background:var(--gold-500); border-color:var(--gold-500); color:#fff; box-shadow:0 0 0 3px rgba(212,160,23,.18);}
.stage-line{position:absolute; top:9px; height:2px; background:var(--line); width:100%; inset-inline-start:50%; z-index:1;}
.stage-seg:last-child .stage-line{display:none;}
.stage-seg.done .stage-line{background:var(--emerald-500);}
.stage-label{font-size:8px; font-weight:700; color:var(--ink-300); margin-top:4px; text-align:center; line-height:1.25; word-break:break-word; padding:0 1px;}
.stage-seg.done .stage-label, .stage-seg.current .stage-label{color:var(--ink-700);}
.stage-date{font-size:7.5px; color:var(--ink-300); font-family:var(--font-en); margin-top:1px;}

.tc-footer{display:flex; align-items:center; justify-content:space-between; padding-top:10px; border-top:1px solid var(--line-soft);}
.tc-assignee{display:flex; align-items:center; gap:8px;}
.avatar{
  width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  color:#fff; font-size:11px; font-weight:800; flex-shrink:0; font-family:var(--font-en);
}
.tc-assignee-name{font-size:12.5px; font-weight:700;}
.tc-actions{display:flex; gap:6px;}
.icon-mini{width:30px; height:30px; border-radius:8px; border:1px solid var(--line); background:var(--bg-card); color:var(--ink-500); font-size:12.5px; display:flex; align-items:center; justify-content:center;}
.icon-mini:hover{background:var(--bg-soft); color:var(--ink-900);}
.icon-mini.danger:hover{background:var(--red-500); color:#fff; border-color:var(--red-500);}

/* ---- Table view ---- */
.table-wrap{overflow-x:auto; background:var(--bg-card); border:1px solid var(--line); border-radius:var(--radius-md); box-shadow:var(--shadow-sm);}
table.data-table{width:100%; border-collapse:collapse; font-size:13px; min-width:900px;}
table.data-table th{
  background:var(--bg-soft); padding:12px 14px; text-align:start; font-weight:800; font-size:12px;
  color:var(--ink-700); white-space:nowrap; position:sticky; top:0; cursor:pointer; user-select:none;
}
table.data-table th:hover{color:var(--emerald-600);}
table.data-table th i{margin-inline-start:5px; font-size:10px; color:var(--ink-300);}
table.data-table th.sorted i{color:var(--emerald-600);}
table.data-table td{padding:11px 14px; border-top:1px solid var(--line-soft); vertical-align:middle;}
table.data-table tr:hover td{background:var(--bg-soft);}
table.data-table td.strong{font-weight:700;}

/* ---- Bulk bar ---- */
.bulk-bar{
  position:sticky; top:66px; z-index:20; background:var(--navy-900); color:#fff; border-radius:12px;
  padding:12px 18px; display:flex; align-items:center; gap:14px; margin-bottom:16px; box-shadow:var(--shadow-md);
  animation:slideUp .18s ease;
}
.bulk-bar b{font-family:var(--font-en);}
.bulk-bar .grow{flex:1;}
.bulk-bar .btn-outline{background:rgba(255,255,255,.08); border-color:rgba(255,255,255,.2); color:#fff;}
.bulk-bar .btn-outline:hover{background:rgba(255,255,255,.16);}

/* ============ EMPLOYEES ============ */
.emp-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(280px,1fr)); gap:16px;}
.emp-card{background:var(--bg-card); border:1px solid var(--line); border-radius:var(--radius-md); padding:18px; box-shadow:var(--shadow-sm); transition:transform .15s;}
.emp-card:hover{transform:translateY(-2px); box-shadow:var(--shadow-md);}
.emp-top{display:flex; align-items:center; gap:12px; margin-bottom:12px;}
.avatar-lg{width:50px; height:50px; border-radius:14px; font-size:17px;}
.emp-name{font-size:15.5px; font-weight:800;}
.emp-role{font-size:12px; color:var(--ink-500);}
.emp-stats{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin:12px 0;}
.emp-stat{text-align:center; background:var(--bg-soft); border-radius:9px; padding:8px 4px;}
.emp-stat b{display:block; font-size:16px; font-weight:900; font-family:var(--font-en);}
.emp-stat span{font-size:10px; color:var(--ink-500); font-weight:600;}
.perf-bar{height:8px; background:var(--bg-soft); border-radius:6px; overflow:hidden; margin-top:4px;}
.perf-fill{height:100%; border-radius:6px; background:linear-gradient(90deg, var(--gold-500), var(--emerald-500));}
.emp-actions{display:flex; gap:6px; margin-top:12px; flex-wrap:wrap;}
.emp-actions .btn{flex:1 1 auto; min-width:70px; justify-content:center;}

/* ============ REPORTS ============ */
.report-share-view{max-width:880px; margin:0 auto;}
.print-only{display:none;}
@media print{
  .sidebar, .topbar, .toolbar, .filter-bar, .no-print{display:none !important;}
  .content{padding:0;}
  .print-only{display:block;}
  body{background:#fff;}
  details > *:not(summary){display:block !important;}
  details summary::-webkit-details-marker{display:none;}
}

/* ============ COMMENTS ============ */
.comment-list{display:flex; flex-direction:column; gap:12px; max-height:280px; overflow-y:auto; margin-bottom:14px; padding-inline-end:4px;}
.comment{display:flex; gap:10px;}
.comment-body{flex:1; background:var(--bg-soft); border-radius:12px; padding:10px 13px;}
.comment-head{display:flex; align-items:center; gap:8px; margin-bottom:3px;}
.comment-author{font-size:12.5px; font-weight:800;}
.comment-time{font-size:10.5px; color:var(--ink-300); font-family:var(--font-en);}
.comment-text{font-size:12.5px; color:var(--ink-700); line-height:1.6;}
.comment-input-row{display:flex; gap:8px;}

/* ============ KPI ============ */
.kpi-list{display:flex; flex-direction:column; gap:10px; margin-bottom:14px;}
.kpi-item{display:flex; align-items:center; gap:10px; background:var(--bg-soft); border-radius:10px; padding:10px 12px;}
.kpi-item .ki-name{flex:1; font-size:12.5px; font-weight:700;}
.kpi-item .ki-score{
  width:36px; height:36px; border-radius:9px; display:flex; align-items:center; justify-content:center;
  font-weight:900; font-size:13.5px; color:#fff; font-family:var(--font-en); flex-shrink:0;
}

/* ============ STEPPER (task modal) ============ */
.tabs{display:flex; gap:4px; border-bottom:1.5px solid var(--line); margin-bottom:18px; overflow-x:auto;}
.tab-btn{padding:10px 16px; background:none; border:none; font-size:13px; font-weight:700; color:var(--ink-500); border-bottom:2.5px solid transparent; white-space:nowrap;}
.tab-btn.active{color:var(--emerald-600); border-color:var(--emerald-600);}
.tab-panel{display:none;}
.tab-panel.active{display:block;}

/* ============ LOGIN / EMPTY ============ */
.progress-mini{width:100%; height:6px; background:var(--bg-soft); border-radius:6px; overflow:hidden; margin-top:8px;}
.progress-mini-fill{height:100%; background:linear-gradient(90deg, var(--emerald-500), var(--gold-500)); border-radius:6px; transition:width .4s;}

/* ============ RESPONSIVE ============ */
@media (max-width: 1080px){
  .dash-grid, .dash-grid-3, .dash-grid-2{grid-template-columns:1fr;}
  .kpi-grid, .kpi-grid.cols-5{grid-template-columns:repeat(2,1fr);}
  .filter-bar{grid-template-columns:1fr 1fr; grid-auto-rows:auto;}
}
@media (max-width: 860px){
  .sidebar{position:fixed; inset-inline-start:0; top:0; height:100vh; transform:translateX(-110%);}
  html[dir="rtl"] .sidebar{transform:translateX(110%);}
  .sidebar.open{transform:translateX(0);}
  .menu-toggle{display:block;}
  .topbar-search{display:none;}
  .kpi-grid, .kpi-grid.cols-5{grid-template-columns:1fr 1fr;}
}
@media (max-width: 560px){
  .kpi-grid, .kpi-grid.cols-5{grid-template-columns:1fr;}
  .task-grid{grid-template-columns:1fr;}
  .field-row{grid-template-columns:1fr;}
  .content{padding:16px;}
}
.sidebar-scrim{display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:39;}
.sidebar-scrim.show{display:block;}

/* ============ VIEW-ONLY MODE ============ */
body.view-only-mode .no-view-only{display:none !important;}
.view-only-banner{
  display:none; background:linear-gradient(90deg, var(--gold-600), var(--gold-500)); color:#fff; padding:9px 20px;
  align-items:center; gap:10px; font-size:13px; font-weight:700;
}
body.view-only-mode .view-only-banner{display:flex;}
.view-only-banner button{
  margin-inline-start:auto; background:rgba(255,255,255,.2); border:1px solid rgba(255,255,255,.4); color:#fff;
  padding:6px 14px; border-radius:8px; font-size:12px; font-weight:700;
}
.view-only-banner button:hover{background:rgba(255,255,255,.32);}
.login-modal-body{padding:26px 24px;}
.login-logo{
  width:56px; height:56px; border-radius:16px; background:linear-gradient(135deg, var(--emerald-500), var(--violet-600));
  display:flex; align-items:center; justify-content:center; color:#fff; font-weight:900; font-size:22px; margin:0 auto 14px;
  font-family:var(--font-en);
}

/* ============ FULL-SCREEN LOGIN PAGE ============ */
.login-fullscreen{
  position:fixed; inset:0; z-index:600;
  background:radial-gradient(circle at 20% 20%, rgba(18,135,107,.35), transparent 45%),
             radial-gradient(circle at 85% 80%, rgba(115,85,172,.35), transparent 45%),
             linear-gradient(160deg, var(--navy-950), var(--navy-900) 60%, var(--navy-800));
  display:flex; align-items:center; justify-content:center; padding:20px;
  animation:fadeIn .2s ease;
}
.login-fs-card{
  background:var(--bg-card); border-radius:20px; box-shadow:0 24px 60px rgba(0,0,0,.35);
  width:100%; max-width:380px; padding:34px 30px 28px; text-align:center;
}
.login-fs-title{font-family:var(--font-en); font-size:24px; font-weight:900; color:var(--navy-900); margin-bottom:2px;}
.login-fs-title span{display:block; font-family:var(--font-ar); font-size:13px; font-weight:700; color:var(--ink-500); margin-top:2px;}
.login-fs-subtitle{font-size:12.5px; color:var(--ink-500); margin-bottom:24px; line-height:1.6;}
.login-fs-card .field{text-align:start;}
.login-fs-admin-link{
  display:block; width:100%; background:none; border:none; color:var(--ink-500); font-size:12px; font-weight:700;
  margin-top:16px; padding:6px; text-decoration:underline;
}
.login-fs-admin-link:hover{color:var(--emerald-600);}

function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      state.tasks = parsed.tasks || [];
      state.employees = parsed.employees || [];
      state.kpiDefinitions = (parsed.kpiDefinitions && parsed.kpiDefinitions.length) ? parsed.kpiDefinitions : DEFAULT_KPI_DEFS.slice();
      state.taskCategories = (parsed.taskCategories && parsed.taskCategories.length) ? parsed.taskCategories : DEFAULT_TASK_CATEGORIES.slice();
      state.employeeUsers = parsed.employeeUsers || [];
      migrateOldStages();
    } else {
      state.kpiDefinitions = DEFAULT_KPI_DEFS.slice();
      state.taskCategories = DEFAULT_TASK_CATEGORIES.slice();
      seedDemoData(true);
    }
    const settingsRaw = localStorage.getItem(SETTINGS_KEY);
    if(settingsRaw){
      const s = JSON.parse(settingsRaw);
      if(s.weekendDays) state.weekendDays = s.weekendDays;
      if(s.stageDurations) state.stageDurations = Object.assign({}, STAGE_DURATION_DAYS, s.stageDurations);
    }
  }catch(e){
    console.error('Load error', e);
    state.kpiDefinitions = DEFAULT_KPI_DEFS.slice();
    state.taskCategories = DEFAULT_TASK_CATEGORIES.slice();
    seedDemoData(true);
  }
}
function migrateOldStages(){
  // Upgrade tasks saved under the old 4-stage scheme (assigned/inprogress/review/completed)
  // to the new 6-stage government transaction workflow.
  let migrated = false;
  state.tasks.forEach(tk => {
    if(tk.status && OLD_STAGE_MIGRATION[tk.status] && !STAGES.includes(tk.status)){
      tk.status = OLD_STAGE_MIGRATION[tk.status];
      migrated = true;
    }
    if(tk.stageDates){
      const newDates = {};
      Object.keys(tk.stageDates).forEach(oldKey => {
        const newKey = STAGES.includes(oldKey) ? oldKey : (OLD_STAGE_MIGRATION[oldKey] || null);
        if(newKey && !newDates[newKey]) newDates[newKey] = tk.stageDates[oldKey];
      });
      tk.stageDates = newDates;
      migrated = true;
    }
    if(tk.isPending === undefined) tk.isPending = false;
  });
  if(migrated) saveData();
}
function saveData(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify({tasks: state.tasks, employees: state.employees, kpiDefinitions: state.kpiDefinitions, taskCategories: state.taskCategories, employeeUsers: state.employeeUsers}));
  requestSyncPush();
}

/* ---------------- UTILITIES ---------------- */
function uid(prefix){ return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function fmtDate(iso){
  if(!iso) return '—';
  const d = new Date(iso + 'T00:00:00');
  if(isNaN(d)) return '—';
  return d.toLocaleDateString(state.lang==='ar'?'ar-EG':'en-GB', {year:'numeric', month:'short', day:'2-digit'});
}
function escapeHtml(str){
  if(str===undefined||str===null) return '';
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function calcWorkDays(startISO, endISO){
  if(!startISO || !endISO) return 0;
  let start = new Date(startISO + 'T00:00:00');
  let end = new Date(endISO + 'T00:00:00');
  if(end < start) return 0;
  let count = 0;
  let cur = new Date(start);
  while(cur <= end){
    if(!state.weekendDays.includes(cur.getDay())) count++;
    cur.setDate(cur.getDate()+1);
  }
  return count;
}
function isOverdue(task){
  if(task.status === 'completed') return false;
  if(!task.dueDate) return false;
  return task.dueDate < todayISO();
}
function daysUntil(dueISO){
  const due = new Date(dueISO + 'T00:00:00');
  const now = new Date(todayISO() + 'T00:00:00');
  return Math.round((due - now) / 86400000);
}
function getEmployee(id){ return state.employees.find(e => e.id === id); }
function employeeName(id){ const e = getEmployee(id); return e ? e.name : t('unassigned'); }
function avatarColor(seed){
  const colors = ['var(--emerald-500)','var(--violet-600)','var(--gold-500)','var(--navy-700)','var(--red-500)','var(--emerald-700)'];
  let hash = 0;
  for(let i=0;i<String(seed).length;i++) hash = String(seed).charCodeAt(i) + ((hash<<5)-hash);
  return colors[Math.abs(hash) % colors.length];
}
function initials(name){
  if(!name) return '?';
  const parts = name.trim().split(' ');
  return (parts[0][0] + (parts[1]?parts[1][0]:'')).toUpperCase();
}
function toast(msg, type){
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast' + (type==='err'?' err':type==='warn'?' warn':'');
  const icon = type==='err' ? 'fa-circle-xmark' : type==='warn' ? 'fa-triangle-exclamation' : 'fa-circle-check';
  el.innerHTML = `<i class="fa-solid ${icon}"></i><span>${escapeHtml(msg)}</span>`;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .3s'; el.style.opacity='0'; setTimeout(()=>el.remove(),300); }, 3200);
}

function saveEmployeeLoginAccount(employeeId){
  if(blockIfViewOnly()) return;
  const username = document.getElementById('emp_user_username').value.trim();
  const password = document.getElementById('emp_user_password').value.trim();
  if(!username || !password){ toast(t('required_field'), 'err'); return; }
  const dup = state.employeeUsers.find(a => a.username === username && a.employeeId !== employeeId);
  if(dup){ toast(t('emp_login_username_taken'), 'err'); return; }
  let account = getEmployeeUserAccount(employeeId);
  if(account){ account.username = username; account.password = password; }
  else { state.employeeUsers.push({id: uid('acct'), username, password, employeeId}); }
  saveData();
  toast(t('emp_login_saved'));
  openEmployeeLoginModal(employeeId);
  renderPage();
}
function removeEmployeeLoginAccount(employeeId){
  if(blockIfViewOnly()) return;
  state.employeeUsers = state.employeeUsers.filter(a => a.employeeId !== employeeId);
  saveData();
  closeModal();
  renderPage();
  toast(t('emp_login_removed'));
}
function copyEmployeeLoginInfo(employeeId){
  const emp = getEmployee(employeeId);
  const account = getEmployeeUserAccount(employeeId);
  if(!emp || !account) return;
  const link = location.origin + location.pathname + '#login';
  const text = state.lang==='ar'
    ? `رابط الدخول: ${link}\nاسم المستخدم: ${account.username}\nكلمة المرور: ${account.password}`
    : `Login link: ${link}\nUsername: ${account.username}\nPassword: ${account.password}`;
  const fallback = document.getElementById('copyLoginFallback');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>{
      toast(t('login_info_copied'));
    }).catch(()=>{ showCopyFallback(text, fallback); });
  } else {
    showCopyFallback(text, fallback);
  }
}
function showCopyFallback(text, container){
  if(!container) return;
  container.innerHTML = `<textarea class="input" rows="3" readonly onclick="this.select()" style="margin-top:10px; font-family:var(--font-en); font-size:11.5px;">${escapeHtml(text)}</textarea>`;
}

function updateTaskStageDates(task, newStatus, customDate){
  const now = customDate || todayISO();
  if(!task.stageDates) task.stageDates = {};
  const idx = STAGES.indexOf(newStatus);
  STAGES.forEach((s, i) => {
    if(i < idx && !task.stageDates[s]) task.stageDates[s] = now;
  });
  task.stageDates[newStatus] = now;
  if(newStatus === 'completed'){
    task.completedDate = now;
  } else {
    task.completedDate = null;
  }
  task.status = newStatus;
}

function renderQuickDecisions(){
  const tasks = visibleTasks();
  const active = tasks.filter(tk=>tk.status!=='completed');
  const rows = [];

  // Most overloaded employee (by active task count) — admin-only insight (compares across employees)
  if(!state.session && state.employees.length){
    const loadMap = state.employees.map(e => ({e, count: active.filter(tk=>tk.assigneeId===e.id).length}))
      .sort((a,b)=>b.count-a.count);
    if(loadMap[0] && loadMap[0].count >= 3){
      rows.push({icon:'fa-weight-hanging', color:'var(--violet-600)', action:`goToTasksFiltered({employee:'${loadMap[0].e.id}', activeOnly:true})`, html: state.lang==='ar'
        ? `<b>${escapeHtml(loadMap[0].e.name)}</b> يحمل أكبر عدد من المهام النشطة حالياً (${loadMap[0].count} مهمة) — قد يحتاج دعماً أو إعادة توزيع.`
        : `<b>${escapeHtml(loadMap[0].e.name)}</b> currently carries the most active tasks (${loadMap[0].count}) — may need support or rebalancing.`});
    }
  }
  // Stale tasks (active for more than 15 work days without completion)
  const staleIds = active.filter(tk => calcWorkDays(tk.startDate, todayISO()) >= 15);
  if(staleIds.length > 0){
    rows.push({icon:'fa-hourglass-half', color:'var(--red-500)', action:`goToTasksFiltered({activeOnly:true})`, html: state.lang==='ar'
      ? `يوجد <b>${staleIds.length}</b> مهمة متوقفة منذ أكثر من 15 يوم عمل دون إنجاز — تستحق المتابعة.`
      : `<b>${staleIds.length}</b> tasks have been open for 15+ work days without completion — worth a check-in.`});
  }
  // Urgent unassigned tasks
  const urgentUnassigned = active.filter(tk => tk.priority==='urgent' && !tk.assigneeId).length;
  if(urgentUnassigned > 0){
    rows.push({icon:'fa-user-slash', color:'var(--red-500)', action:`goToTasksFiltered({priority:'urgent', activeOnly:true})`, html: state.lang==='ar'
      ? `<b>${urgentUnassigned}</b> مهمة عاجلة بدون موظف مسؤول — يجب إسنادها فوراً.`
      : `<b>${urgentUnassigned}</b> urgent tasks have no assignee — should be assigned immediately.`});
  }
  // Overdue concentration
  const overdueCount = active.filter(isOverdue).length;
  if(overdueCount > 0){
    const ratio = active.length ? Math.round(overdueCount/active.length*100) : 0;
    rows.push({icon:'fa-triangle-exclamation', color:'var(--gold-500)', action:`goToTasksFiltered({overdueOnly:true})`, html: state.lang==='ar'
      ? `<b>${overdueCount}</b> مهمة متأخرة (${ratio}% من المهام النشطة) — راجع صفحة المهام لإعادة الجدولة.`
      : `<b>${overdueCount}</b> overdue tasks (${ratio}% of active work) — review the Tasks page for rescheduling.`});
  }
  // Bottleneck stage
  const stageCounts = {};
  STAGES.filter(s=>s!=='completed').forEach(s => stageCounts[s] = 0);
  active.forEach(tk => { if(stageCounts[tk.status]!==undefined) stageCounts[tk.status]++; });
  const bottleneck = Object.entries(stageCounts).sort((a,b)=>b[1]-a[1])[0];
  if(bottleneck && bottleneck[1] >= 3){
    rows.push({icon:'fa-diagram-project', color:'var(--navy-700)', action:`goToTasksFiltered({status:'${bottleneck[0]}'})`, html: state.lang==='ar'
      ? `أكبر تكدّس للمهام حالياً في مرحلة <b>${t(STAGE_LABEL_KEY[bottleneck[0]])}</b> (${bottleneck[1]} مهمة).`
      : `The biggest task pile-up right now is at the <b>${t(STAGE_LABEL_KEY[bottleneck[0]])}</b> stage (${bottleneck[1]} tasks).`});
  }
  // Pending tasks needing attention
  const pendingCount = active.filter(tk => tk.isPending).length;
  if(pendingCount > 0){
    rows.push({icon:'fa-pause', color:'var(--red-500)', action:`goToTasksFiltered({pendingOnly:true})`, html: state.lang==='ar'
      ? `يوجد <b>${pendingCount}</b> معاملة معلقة حالياً — راجعها لتحديد ما يلزم لإعادة تحريكها.`
      : `<b>${pendingCount}</b> transactions are currently pending — review them to determine what's needed to move forward.`});
  }

  if(!rows.length) return `<div class="empty-state" style="padding:14px;"><i class="fa-solid fa-circle-check"></i>${t('no_decisions')}</div>`;
  return rows.slice(0,6).map(r => `<div class="decision-row" onclick="${r.action}" style="cursor:pointer;"><div class="d-ico" style="background:${r.color};"><i class="fa-solid ${r.icon}"></i></div><div class="d-text">${r.html}</div><i class="fa-solid fa-chevron-left muted" style="font-size:11px; align-self:center; flex-shrink:0;"></i></div>`).join('');
}
function kpiCard(icon, colorVar, value, label, trend, onclickAction){
  const clickable = !!onclickAction;
  return `<div class="kpi-card${clickable?' kpi-card-clickable':''}" style="--accent:var(--${colorVar});${clickable?'cursor:pointer;':''}"${clickable?` onclick="${onclickAction}"`:''}>
    <div class="kpi-top">
      <div class="kpi-icon" style="background:var(--${colorVar})"><i class="fa-solid ${icon}"></i></div>
      ${trend ? `<span class="kpi-trend up"><i class="fa-solid fa-arrow-up"></i>${trend}</span>` : ''}
    </div>
    <div class="kpi-value">${value}</div>
    <div class="kpi-label">${label}</div>
  </div>`;
}
function alertRow(tk, days, readOnly){
  const overdueFlag = days < 0;
  const iconBg = overdueFlag ? 'var(--red-500)' : days===0 ? 'var(--gold-500)' : 'var(--violet-500)';
  const subText = overdueFlag ? `${t('overdue_by')} ${Math.abs(days)} ${t('days_left')}` : days===0 ? t('due_today') : `${t('due_in')} ${days} ${t('days_left')}`;
  const clickHandler = readOnly ? `openTaskReadOnlyModal('${tk.id}')` : `openTaskModal('${tk.id}')`;
  return `<div class="alert-row" onclick="${clickHandler}">
    <div class="a-ico" style="background:${iconBg}; color:#fff;"><i class="fa-solid ${overdueFlag?'fa-clock-rotate-left':'fa-hourglass-half'}"></i></div>
    <div class="a-body">
      <div class="a-title">${escapeHtml(tk.title)}</div>
      <div class="a-sub">${employeeName(tk.assigneeId)} · ${subText}</div>
    </div>
    ${statusBadge(tk.status)}
  </div>`;
}
function renderMonthCompare(){
  const now = new Date();
  const thisMonthKey = now.getFullYear()+'-'+now.getMonth();
  const lastMonthDate = new Date(now.getFullYear(), now.getMonth()-1, 1);
  const lastMonthKey = lastMonthDate.getFullYear()+'-'+lastMonthDate.getMonth();
  let thisCount=0, lastCount=0;
  visibleTasks().forEach(tk => {
    if(tk.status==='completed' && tk.completedDate){
      const d = new Date(tk.completedDate+'T00:00:00');
      const key = d.getFullYear()+'-'+d.getMonth();
      if(key===thisMonthKey) thisCount++;
      else if(key===lastMonthKey) lastCount++;
    }
  });
  const max = Math.max(thisCount, lastCount, 1);
  return `<div class="compare-bars">
    <div class="compare-row">
      <div class="compare-label">${t('this_month')}</div>
      <div class="compare-track"><div class="compare-fill" style="width:${thisCount/max*100}%; background:linear-gradient(90deg,var(--emerald-500),var(--emerald-600));">${thisCount}</div></div>
    </div>
    <div class="compare-row">
      <div class="compare-label">${t('last_month')}</div>
      <div class="compare-track"><div class="compare-fill" style="width:${lastCount/max*100}%; background:linear-gradient(90deg,var(--violet-500),var(--violet-700));">${lastCount}</div></div>
    </div>
  </div>
  <p class="muted" style="font-size:11.5px; margin-top:14px;"><i class="fa-solid fa-circle-info"></i> ${thisCount>=lastCount ? (state.lang==='ar'?'أداء هذا الشهر أفضل أو مساوٍ للشهر الماضي.':'This month performance is equal or better than last month.') : (state.lang==='ar'?'أداء هذا الشهر أقل من الشهر الماضي حتى الآن.':'This month is behind last month so far.')}</p>`;
}
function renderTopPerformers(){
  const perf = state.employees.map(e => {
    const scores = [];
    state.tasks.forEach(tk => (tk.kpis||[]).forEach(k => { if(k.employeeId===e.id) scores.push(k.score); }));
    const avg = scores.length ? scores.reduce((a,b)=>a+b,0)/scores.length : 0;
    const completedCount = state.tasks.filter(tk=>tk.assigneeId===e.id && tk.status==='completed').length;
    return {e, avg, completedCount, evalCount: scores.length};
  }).sort((a,b)=> b.avg - a.avg).slice(0,5);
  if(!perf.length || perf.every(p=>p.avg===0 && p.completedCount===0)){
    return `<div class="empty-state"><i class="fa-solid fa-user-clock"></i>${t('no_employees')}</div>`;
  }
  return `<div class="compare-bars">${perf.map(p => `
    <div class="compare-row" style="cursor:pointer;" onclick="openEmployeeKpiModal('${p.e.id}')" title="${t('view_evaluations')}">
      <div class="compare-label" style="width:auto; display:flex; align-items:center; gap:8px; flex-shrink:0; min-width:100px;">
        <span class="avatar" style="background:${avatarColor(p.e.id)}; width:24px; height:24px; font-size:9.5px;">${initials(p.e.name)}</span>
        <span style="font-size:12px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:66px;">${escapeHtml(p.e.name)}</span>
      </div>
      <div class="compare-track"><div class="compare-fill" style="width:${p.avg/10*100}%; background:linear-gradient(90deg,var(--gold-500),var(--emerald-600));">${p.avg.toFixed(1)}</div></div>
      <span class="badge badge-navy" style="flex-shrink:0;"><i class="fa-solid fa-list-ul" style="font-size:9px;"></i>${p.evalCount}</span>
    </div>`).join('')}</div>`;
}

/* ---- Employee KPI detail modal (interactive evaluations view) ---- */
function openEmployeeKpiModal(empId){
  const emp = getEmployee(empId);
  if(!emp) return;
  state.ui.empKpiModalSearch = '';
  renderEmployeeKpiModal(empId);
}
function renderEmployeeKpiModal(empId){
  const emp = getEmployee(empId);
  if(!emp) return;
  const searchText = (state.ui.empKpiModalSearch||'').toLowerCase().trim();
  let evals = [];
  state.tasks.forEach(tk => (tk.kpis||[]).forEach(k => {
    if(k.employeeId === empId) evals.push({...k, taskId: tk.id, taskTitle: tk.title, taskStatus: tk.status});
  }));
  evals.sort((a,b) => (b.date||'').localeCompare(a.date||''));
  const avg = evals.length ? evals.reduce((a,b)=>a+b.score,0)/evals.length : 0;
  const lvl = performanceLevel(avg);
  const filteredEvals = searchText ? evals.filter(k => (kpiEvalDisplayName(k)+' '+k.taskTitle).toLowerCase().includes(searchText)) : evals;

  const empTasks = state.tasks.filter(tk => tk.assigneeId===empId);
  const doneTasks = empTasks.filter(tk => tk.status==='completed');
  const totalTasks = empTasks.length;
  const completionDays = doneTasks.filter(tk=>tk.completedDate).map(tk => calcWorkDays(tk.startDate, tk.completedDate));
  const avgDays = completionDays.length ? (completionDays.reduce((a,b)=>a+b,0)/completionDays.length) : 0;

  // Aggregated comments across this employee's tasks (and comments authored by them)
  const relatedComments = [];
  state.tasks.forEach(tk => {
    (tk.comments||[]).forEach(c => {
      if(tk.assigneeId === empId || c.author === emp.name){
        relatedComments.push({...c, taskId: tk.id, taskTitle: tk.title});
      }
    });
  });
  relatedComments.sort((a,b) => b.time - a.time);
  const filteredComments = searchText ? relatedComments.filter(c => (c.text+' '+c.taskTitle).toLowerCase().includes(searchText)) : relatedComments;

  document.getElementById('modalRoot').innerHTML = `
  <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
    <div class="modal modal-wide">
      <div class="modal-head">
        <span class="avatar" style="background:${avatarColor(empId)}; width:36px; height:36px; font-size:13px; margin-inline-end:10px;">${initials(emp.name)}</span>
        <h3>${escapeHtml(emp.name)} — ${t('tab_kpi')}</h3>
        <span class="badge" style="background:${lvl.color}22; color:${lvl.color}; margin-inline-end:6px;"><i class="fa-solid fa-${lvl.icon||'star'}" style="font-size:10px;"></i>${t(lvl.key)}</span>
        <button class="icon-btn" onclick="printEmployeeKpiReport('${empId}')" title="${t('print')}"><i class="fa-solid fa-print"></i></button>
        <button class="modal-close" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="modal-body">
        <div class="emp-stats" style="grid-template-columns:repeat(5,1fr); margin-bottom:14px;">
          <div class="emp-stat"><b>${avg.toFixed(1)}</b><span>${t('kpi_score_avg')}</span></div>
          <div class="emp-stat"><b>${evals.length}</b><span>${t('kpi_evals_count')}</span></div>
          <div class="emp-stat"><b>${doneTasks.length}</b><span>${t('kpi_tasks_done')}</span></div>
          <div class="emp-stat"><b>${totalTasks}</b><span>${t('emp_tasks')}</span></div>
          <div class="emp-stat"><b>${avgDays ? avgDays.toFixed(1) : '—'}</b><span>${t('avg_completion_days')}</span></div>
        </div>
        <div class="perf-bar" style="margin-bottom:16px;"><div class="perf-fill" style="width:${avg/10*100}%; background:linear-gradient(90deg, ${lvl.color}, ${lvl.color});"></div></div>

        <div class="field" style="margin-bottom:16px;">
          <input class="input" type="text" placeholder="${t('emp_kpi_search_ph')}" value="${escapeHtml(state.ui.empKpiModalSearch||'')}" oninput="updateEmpKpiModalSearch('${empId}', this.value)">
        </div>

        <div class="section-title" style="font-size:14px;"><i class="fa-solid fa-gauge-high"></i>${t('all_evaluations')} ${filteredEvals.length!==evals.length?`(${filteredEvals.length}/${evals.length})`:''}</div>
        ${filteredEvals.length ? `<div class="kpi-list" style="margin-bottom:20px;">${filteredEvals.map(k => {
          const klvl = performanceLevel(k.score);
          return `
          <div class="kpi-item" style="cursor:pointer; align-items:flex-start;" onclick="closeModal(); openTaskModal('${k.taskId}')">
            <div class="ki-score" style="background:${kpiScoreColor(k.score)}; flex-shrink:0;">${k.score}</div>
            <div style="flex:1; min-width:0;">
              <div class="ki-name">${escapeHtml(kpiEvalDisplayName(k))}</div>
              <div class="muted" style="font-size:11px; margin-top:2px; display:flex; align-items:center; gap:6px; flex-wrap:wrap;">
                <i class="fa-solid fa-link" style="font-size:9px;"></i>${escapeHtml(k.taskTitle)}
                ${statusBadge(k.taskStatus)}
                <span>· ${fmtDate(k.date)}</span>
              </div>
            </div>
            <span class="badge" style="background:${klvl.color}22; color:${klvl.color}; flex-shrink:0;">${t(klvl.key)}</span>
          </div>`;}).join('')}</div>` : `<div class="empty-state" style="padding:16px;"><i class="fa-solid fa-gauge-high"></i>${t('no_kpis_yet')}</div>`}

        <div class="section-title" style="font-size:14px;"><i class="fa-solid fa-comments"></i>${t('related_comments')} ${filteredComments.length!==relatedComments.length?`(${filteredComments.length}/${relatedComments.length})`:''}</div>
        ${filteredComments.length ? `<div class="comment-list" style="max-height:220px;">${filteredComments.map(c => `
          <div class="comment">
            <span class="avatar" style="background:${avatarColor(c.author)}; flex-shrink:0;">${initials(c.author)}</span>
            <div class="comment-body" style="cursor:pointer;" onclick="closeModal(); openTaskModal('${c.taskId}')">
              <div class="comment-head"><span class="comment-author">${escapeHtml(c.author)}</span><span class="comment-time">${new Date(c.time).toLocaleDateString(state.lang==='ar'?'ar-EG':'en-GB')}</span></div>
              <div class="comment-text">${escapeHtml(c.text)}</div>
              <div class="muted" style="font-size:10.5px; margin-top:3px;"><i class="fa-solid fa-link" style="font-size:9px;"></i> ${escapeHtml(c.taskTitle)}</div>
            </div>
          </div>`).join('')}</div>` : `<div class="empty-state" style="padding:16px;"><i class="fa-solid fa-comment-dots"></i>${t('no_comments')}</div>`}
      </div>
      <div class="modal-foot"><button class="btn btn-outline" onclick="closeModal()">${t('close')}</button></div>
    </div>
  </div>`;
}

}

let statusChartInstance=null, priorityChartInstance=null, empTasksChartInstance=null, trendChartInstance=null, workloadChartInstance=null, agingChartInstance=null;
function afterRenderDashboard(){
  const gridColor = state.theme==='dark' ? '#233058' : '#EDEFF6';
  const tickColor = state.theme==='dark' ? '#8D94B8' : '#6B7392';
  const labelColor = state.theme==='dark' ? '#C7CCE2' : '#3B4562';

  const statusCounts = {};
  STAGES.forEach(s => statusCounts[s] = 0);
  visibleTasks().forEach(tk => { if(statusCounts[tk.status]!==undefined) statusCounts[tk.status]++; });
  const ctx = document.getElementById('statusChart');
  if(statusChartInstance) statusChartInstance.destroy();
  if(ctx){
    statusChartInstance = new Chart(ctx, {
      type:'doughnut',
      data:{
        labels: STAGES.map(s => t(STAGE_LABEL_KEY[s])),
        datasets:[{data: STAGES.map(s => statusCounts[s]),
          backgroundColor: STAGES.map(s => STATUS_CHART_COLORS[s]), borderWidth:0, hoverOffset:6}]
      },
      options:{ maintainAspectRatio:false, plugins:{legend:{position:'bottom', labels:{color: labelColor, padding:10, boxWidth:11, font:{family:'Tajawal', size:11.5, weight:'600'}}}}, cutout:'62%',
        onClick:(evt, elements) => {
          if(elements && elements.length){
            if(evt.native) evt.native.stopPropagation();
            goToTasksFiltered({status: STAGES[elements[0].index]});
          }
        }
      }
    });
  }
  const priorityCounts = {low:0, medium:0, high:0, urgent:0};
  visibleTasks().forEach(tk => { if(priorityCounts[tk.priority]!==undefined) priorityCounts[tk.priority]++; });
  const ctx2 = document.getElementById('priorityChart');
  if(priorityChartInstance) priorityChartInstance.destroy();
  if(ctx2){
    priorityChartInstance = new Chart(ctx2, {
      type:'bar',
      data:{
        labels:[t('pr_low'),t('pr_medium'),t('pr_high'),t('pr_urgent')],
        datasets:[{data:[priorityCounts.low,priorityCounts.medium,priorityCounts.high,priorityCounts.urgent],
          backgroundColor:['#A6ACC4','#2B4680','#D4A017','#D4453D'], borderRadius:6, maxBarThickness:32}]
      },
      options:{ maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{
        x:{grid:{display:false}, ticks:{color: labelColor, font:{family:'Tajawal', size:11}}},
        y:{beginAtZero:true, ticks:{stepSize:1, color: tickColor, font:{size:11}}, grid:{color: gridColor}}
      },
        onClick:(evt, elements) => {
          if(elements && elements.length){
            if(evt.native) evt.native.stopPropagation();
            const priorities = ['low','medium','high','urgent'];
            goToTasksFiltered({priority: priorities[elements[0].index]});
          }
        }
      }
    });
  }

  // Tasks per employee
  const ctx3 = document.getElementById('empTasksChart');
  if(empTasksChartInstance) empTasksChartInstance.destroy();
  if(ctx3){
    const empData = state.employees.map(e => ({
      name: e.name,
      total: state.tasks.filter(tk=>tk.assigneeId===e.id).length,
      completed: state.tasks.filter(tk=>tk.assigneeId===e.id && tk.status==='completed').length
    })).sort((a,b)=>b.total-a.total).slice(0,8);
    empTasksChartInstance = new Chart(ctx3, {
      type:'bar',
      data:{
        labels: empData.map(d=>d.name),
        datasets:[
          {label:t('kpi_total'), data:empData.map(d=>d.total), backgroundColor:'#5B3E8C99', borderRadius:5, maxBarThickness:22},
          {label:t('emp_completed'), data:empData.map(d=>d.completed), backgroundColor:'#0E6E5A', borderRadius:5, maxBarThickness:22}
        ]
      },
      options:{ maintainAspectRatio:false, plugins:{legend:{position:'bottom', labels:{color:labelColor, boxWidth:11, font:{family:'Tajawal', size:11}}}}, scales:{
        x:{grid:{display:false}, ticks:{color: labelColor, font:{family:'Tajawal', size:10.5}, maxRotation:0, autoSkip:true}},
        y:{beginAtZero:true, ticks:{stepSize:1, color: tickColor, font:{size:11}}, grid:{color: gridColor}}
      }}
    });
  }

  // 6-month trend: created vs completed
  const ctx4 = document.getElementById('trendChart');
  if(trendChartInstance) trendChartInstance.destroy();
  if(ctx4){
    const months = [];
    const now = new Date();
    for(let i=5;i>=0;i--){
      const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
      months.push({y:d.getFullYear(), m:d.getMonth(), label: d.toLocaleDateString(state.lang==='ar'?'ar-EG':'en-GB',{month:'short'})});
    }
    const createdCounts = months.map(mo => state.tasks.filter(tk => {
      const d = new Date(tk.createdAt);
      return d.getFullYear()===mo.y && d.getMonth()===mo.m;
    }).length);
    const completedCounts = months.map(mo => state.tasks.filter(tk => {
      if(!tk.completedDate) return false;
      const d = new Date(tk.completedDate+'T00:00:00');
      return d.getFullYear()===mo.y && d.getMonth()===mo.m;
    }).length);
    trendChartInstance = new Chart(ctx4, {
      type:'line',
      data:{
        labels: months.map(mo=>mo.label),
        datasets:[
          {label:t('kpi_total'), data:createdCounts, borderColor:'#5B3E8C', backgroundColor:'#5B3E8C22', tension:.35, fill:true, pointRadius:3},
          {label:t('kpi_completed'), data:completedCounts, borderColor:'#0E6E5A', backgroundColor:'#0E6E5A22', tension:.35, fill:true, pointRadius:3}
        ]
      },
      options:{ maintainAspectRatio:false, plugins:{legend:{position:'bottom', labels:{color:labelColor, boxWidth:11, font:{family:'Tajawal', size:11}}}}, scales:{
        x:{grid:{display:false}, ticks:{color: labelColor, font:{family:'Tajawal', size:11}}},
        y:{beginAtZero:true, ticks:{stepSize:1, color: tickColor, font:{size:11}}, grid:{color: gridColor}}
      }}
    });
  }

  // Workload by employee (active tasks only)
  const ctx5 = document.getElementById('workloadChart');
  if(workloadChartInstance) workloadChartInstance.destroy();
  if(ctx5){
    const wData = state.employees.map(e => ({
      name: e.name,
      count: state.tasks.filter(tk=>tk.assigneeId===e.id && tk.status!=='completed').length
    })).sort((a,b)=>b.count-a.count);
    workloadChartInstance = new Chart(ctx5, {
      type:'bar', data:{ labels: wData.map(d=>d.name), datasets:[{data:wData.map(d=>d.count), backgroundColor:'#7355AC', borderRadius:5, maxBarThickness:20}] },
      options:{ maintainAspectRatio:false, indexAxis:'y', plugins:{legend:{display:false}}, scales:{
        x:{beginAtZero:true, ticks:{stepSize:1, color:tickColor, font:{size:11}}, grid:{color:gridColor}},
        y:{ticks:{color:labelColor, font:{family:'Tajawal', size:10.5}}, grid:{display:false}}
      }}
    });
  }

  // Active task aging buckets
  const ctx6 = document.getElementById('agingChart');
  if(agingChartInstance) agingChartInstance.destroy();
  if(ctx6){
    const buckets = {b1:0,b2:0,b3:0,b4:0};
    state.tasks.filter(tk=>tk.status!=='completed').forEach(tk => {
      const days = calcWorkDays(tk.startDate, todayISO());
      if(days<=3) buckets.b1++; else if(days<=7) buckets.b2++; else if(days<=14) buckets.b3++; else buckets.b4++;
    });
    agingChartInstance = new Chart(ctx6, {
      type:'bar',
      data:{ labels:[t('aging_0_3'),t('aging_4_7'),t('aging_8_14'),t('aging_15_plus')],

}

/* ================================================================
   CHART CUSTOMIZE MODAL (click any dashboard chart to explore it)
   ================================================================ */
function getChartRegistryData(key){
  const tasks = visibleTasks();
  if(key==='status'){
    const c = {};
    STAGES.forEach(s => c[s] = 0);
    tasks.forEach(tk=>{ if(c[tk.status]!==undefined) c[tk.status]++; });
    return { title:t('status_dist'), labels: STAGES.map(s => t(STAGE_LABEL_KEY[s])),
      datasets:[{ label:t('kpi_total'), values: STAGES.map(s=>c[s]), colors: STAGES.map(s=>STATUS_CHART_COLORS[s]) }],
      defaultType:'doughnut', allowedTypes:['doughnut','bar','pie'] };
  }
  if(key==='priority'){
    const c = {low:0, medium:0, high:0, urgent:0};
    tasks.forEach(tk=>{ if(c[tk.priority]!==undefined) c[tk.priority]++; });
    return { title:t('priority_dist'), labels:[t('pr_low'),t('pr_medium'),t('pr_high'),t('pr_urgent')],
      datasets:[{ label:t('kpi_total'), values:[c.low,c.medium,c.high,c.urgent], colors:['#A6ACC4','#2B4680','#D4A017','#D4453D'] }],
      defaultType:'bar', allowedTypes:['bar','doughnut','pie'] };
  }
  if(key==='category'){
    const palette = ['#12876B','#5B3E8C','#D4A017','#2B4680','#D4453D','#1FA987','#7355AC','#B3860E'];
    const counts = {};
    let noCatCount = 0;
    tasks.forEach(tk => {
      const name = taskCategoryDisplayName(tk);
      if(!name){ noCatCount++; return; }
      counts[name] = (counts[name]||0) + 1;
    });
    const labels = Object.keys(counts);
    if(noCatCount) labels.push(t('no_category'));
    const values = Object.values(counts);
    if(noCatCount) values.push(noCatCount);
    return { title:t('category_dist'), labels,
      datasets:[{ label:t('kpi_total'), values, colors: labels.map((l,i)=> l===t('no_category') ? '#A6ACC4' : palette[i%palette.length]) }],
      defaultType:'doughnut', allowedTypes:['doughnut','bar','pie'] };
  }
  if(key==='empTasks'){
    const data = state.employees.map(e => ({ name:e.name,
      total: tasks.filter(tk=>tk.assigneeId===e.id).length,
      completed: tasks.filter(tk=>tk.assigneeId===e.id && tk.status==='completed').length
    })).sort((a,b)=>b.total-a.total);
    return { title:t('tasks_per_employee'), labels:data.map(d=>d.name),
      datasets:[{label:t('kpi_total'), values:data.map(d=>d.total), color:'#7355AC'}, {label:t('emp_completed'), values:data.map(d=>d.completed), color:'#0E6E5A'}],
      defaultType:'bar', allowedTypes:['bar'] };
  }
  if(key==='workload'){
    const data = state.employees.map(e => ({ name:e.name,
      count: tasks.filter(tk=>tk.assigneeId===e.id && tk.status!=='completed').length
    })).sort((a,b)=>b.count-a.count);
    return { title:t('workload_by_employee'), labels:data.map(d=>d.name),
      datasets:[{label:t('exec_active_tasks'), values:data.map(d=>d.count), color:'#7355AC'}],
      defaultType:'bar', allowedTypes:['bar'] };
  }
  if(key==='aging'){
    const buckets = {b1:0,b2:0,b3:0,b4:0};
    tasks.filter(tk=>tk.status!=='completed').forEach(tk => {
      const days = calcWorkDays(tk.startDate, todayISO());
      if(days<=3) buckets.b1++; else if(days<=7) buckets.b2++; else if(days<=14) buckets.b3++; else buckets.b4++;
    });
    return { title:t('task_aging'), labels:[t('aging_0_3'),t('aging_4_7'),t('aging_8_14'),t('aging_15_plus')],
      datasets:[{label:t('exec_active_tasks'), values:[buckets.b1,buckets.b2,buckets.b3,buckets.b4], colors:['#1FA987','#D4A017','#D4453D','#B3332C']}],
      defaultType:'bar', allowedTypes:['bar','doughnut'] };
  }
  if(key==='trend'){
    const months = [];
    const now = new Date();
    for(let i=5;i>=0;i--){
      const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
      months.push({y:d.getFullYear(), m:d.getMonth(), label: d.toLocaleDateString(state.lang==='ar'?'ar-EG':'en-GB',{month:'short'})});
    }
    const createdCounts = months.map(mo => tasks.filter(tk => { const d=new Date(tk.createdAt); return d.getFullYear()===mo.y && d.getMonth()===mo.m; }).length);
    const completedCounts = months.map(mo => tasks.filter(tk => { if(!tk.completedDate) return false; const d=new Date(tk.completedDate+'T00:00:00'); return d.getFullYear()===mo.y && d.getMonth()===mo.m; }).length);
    return { title:t('completion_trend'), labels: months.map(mo=>mo.label),
      datasets:[{label:t('kpi_total'), values:createdCounts, color:'#5B3E8C'}, {label:t('kpi_completed'), values:completedCounts, color:'#0E6E5A'}],
      defaultType:'line', allowedTypes:['line','bar'] };
  }
  if(key==='teamComparison'){
    const data = state.employees.map(e => {
      const scores = [];
      tasks.forEach(tk => (tk.kpis||[]).forEach(k => { if(k.employeeId===e.id) scores.push(k.score); }));
      const avg = scores.length ? scores.reduce((a,b)=>a+b,0)/scores.length : 0;
      return {name:e.name, avg};
    }).sort((a,b)=>b.avg-a.avg);
    return { title:t('exec_team_comparison'), labels:data.map(d=>d.name),
      datasets:[{label:t('kpi_score_avg'), values:data.map(d=>+d.avg.toFixed(1)), colors:data.map(d=>performanceLevelHex(d.avg))}],
      defaultType:'bar', allowedTypes:['bar'] };
  }
  if(key==='priorityVsDays'){
    const priorityOrder = ['urgent','high','medium','low'];
    const values = priorityOrder.map(p => {
      const done = tasks.filter(tk => tk.priority===p && tk.status==='completed' && tk.completedDate);
      const days = done.map(tk => calcWorkDays(tk.startDate, tk.completedDate));
      return days.length ? +(days.reduce((a,b)=>a+b,0)/days.length).toFixed(1) : 0;
    });
    return { title:t('rel_priority_days'), labels:priorityOrder.map(p=>t(PRIORITY_LABEL_KEY[p])),
      datasets:[{label:t('exec_avg_days_by_priority'), values, colors:['#D4453D','#D4A017','#2B4680','#A6ACC4']}],
      defaultType:'bar', allowedTypes:['bar'] };
  }
  if(key==='workloadVsPerformance'){
    const data = state.employees.map(e => {
      const active = tasks.filter(tk=>tk.assigneeId===e.id && tk.status!=='completed').length;
      const scores = [];
      tasks.forEach(tk => (tk.kpis||[]).forEach(k => { if(k.employeeId===e.id) scores.push(k.score); }));
      const avg = scores.length ? scores.reduce((a,b)=>a+b,0)/scores.length : 0;
      return {name:e.name, active, avg:+avg.toFixed(1)};
    });
    return { title:t('rel_workload_perf'), labels:data.map(d=>d.name),
      datasets:[{label:t('exec_active_tasks'), values:data.map(d=>d.active), color:'#7355AC'}, {label:t('kpi_score_avg'), values:data.map(d=>d.avg), color:'#D4A017'}],
      defaultType:'bar', allowedTypes:['bar'] };
  }
  return null;
}
function openChartCustomizeModal(key, type){
  const reg = getChartRegistryData(key);
  if(!reg) return;
  const chosenType = type || reg.defaultType;
  document.getElementById('modalRoot').innerHTML = `
  <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
    <div class="modal modal-wide">
      <div class="modal-head">
        <h3 style="flex:1;">${escapeHtml(reg.title)}</h3>
        <button class="modal-close" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="modal-body">
        ${reg.allowedTypes.length>1 ? `
        <div class="view-toggle" style="margin-bottom:16px; width:fit-content;">
          ${reg.allowedTypes.map(ty => `<button class="${ty===chosenType?'active':''}" onclick="openChartCustomizeModal('${key}','${ty}')">${t('chart_type_'+ty)}</button>`).join('')}
        </div>` : ''}
        <div style="height:320px; margin-bottom:20px;"><canvas id="customizeChartCanvas"></canvas></div>
        <div class="section-title" style="font-size:13px;"><i class="fa-solid fa-table"></i>${t('data_table')}</div>
        <div class="table-wrap">
          <table class="data-table">
            <thead><tr><th></th>${reg.datasets.map(ds=>`<th>${escapeHtml(ds.label)}</th>`).join('')}</tr></thead>
            <tbody>${reg.labels.map((lab,i) => `<tr><td class="strong">${escapeHtml(lab)}</td>${reg.datasets.map(ds=>`<td>${ds.values[i]}</td>`).join('')}</tr>`).join('')}</tbody>
          </table>
        </div>
      </div>
      <div class="modal-foot"><button class="btn btn-outline" onclick="closeModal()">${t('close')}</button></div>
    </div>
  </div>`;
  renderCustomizeChart(reg, chosenType);
}
let customizeChartInstance = null;
function buildChartConfig(reg, type){
  const gridColor = state.theme==='dark' ? '#233058' : '#EDEFF6';
  const tickColor = state.theme==='dark' ? '#8D94B8' : '#6B7392';
  const labelColor = state.theme==='dark' ? '#C7CCE2' : '#3B4562';
  const isCircular = type==='doughnut' || type==='pie';
  const datasets = reg.datasets.map(ds => {
    if(isCircular) return {label:ds.label, data:ds.values, backgroundColor: ds.colors || ds.color, borderWidth:0};
    if(type==='line') return {label:ds.label, data:ds.values, borderColor: ds.color || (ds.colors&&ds.colors[0]), backgroundColor:(ds.color||(ds.colors&&ds.colors[0]))+'22', tension:.35, fill:true, pointRadius:3};
    return {label:ds.label, data:ds.values, backgroundColor: ds.colors || ds.color, borderRadius:6, maxBarThickness:30};
  });
  const useHorizontal = type==='bar' && reg.datasets.length===1 && reg.labels.length>6;
  return {
    type: type,
    data: {labels: reg.labels, datasets},
    options: {
      maintainAspectRatio:false,
      indexAxis: useHorizontal ? 'y' : 'x',
      plugins:{legend:{display: reg.datasets.length>1 || isCircular, position:'bottom', labels:{color:labelColor, boxWidth:11, font:{family:'Tajawal', size:11}}}},
      scales: isCircular ? {} : {
        x:{beginAtZero:true, grid:{color:gridColor}, ticks:{color:labelColor, font:{family:'Tajawal', size:11}}},
        y:{beginAtZero:true, grid:{color:gridColor}, ticks:{color:tickColor, font:{size:11}}}
      }
    }
  };
}
function renderCustomizeChart(reg, type){
  const ctx = document.getElementById('customizeChartCanvas');
  if(customizeChartInstance) customizeChartInstance.destroy();
  if(!ctx) return;
  customizeChartInstance = new Chart(ctx, buildChartConfig(reg, type));
}

function statusBadge(status){
  return `<span class="badge badge-${STATUS_COLOR[status]}"><span class="badge-dot" style="background:currentColor;"></span>${t(STAGE_LABEL_KEY[status])}</span>`;
}
function priorityBadge(priority){
  return `<span class="badge badge-${PRIORITY_COLOR[priority]}"><i class="fa-solid fa-flag" style="font-size:9px;"></i>${t(PRIORITY_LABEL_KEY[priority])}</span>`;
}
function categoryBadge(tk){
  const name = taskCategoryDisplayName(tk);
  if(!name) return '';
  return `<span class="badge badge-violet"><i class="fa-solid fa-tag" style="font-size:9px;"></i>${escapeHtml(name)}</span>`;
}
function pendingBadge(tk){
  if(!tk.isPending) return '';
  return `<span class="badge badge-red"><i class="fa-solid fa-pause" style="font-size:9px;"></i>${t('task_pending')}</span>`;
}
function getFilteredTasks(){
  const f = state.ui.taskFilters;
  return visibleTasks().filter(tk => {
    if(f.q){
      const q = f.q.toLowerCase();
      const hay = (tk.title+' '+tk.description+' '+employeeName(tk.assigneeId)).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    if(f.status && tk.status !== f.status) return false;
    if(f.priority && tk.priority !== f.priority) return false;
    if(f.employee && tk.assigneeId !== f.employee) return false;
    if(f.category && tk.categoryId !== f.category) return false;
    if(f.pendingOnly && !tk.isPending) return false;
    if(f.activeOnly && tk.status==='completed') return false;
    if(f.overdueOnly && !isOverdue(tk)) return false;
    if(f.from && tk.dueDate && tk.dueDate < f.from) return false;
    if(f.to && tk.dueDate && tk.dueDate > f.to) return false;
    return true;
  });
}
function sortTasks(tasks){
  const {sortCol, sortDir} = state.ui;
  const dir = sortDir==='asc' ? 1 : -1;
  return [...tasks].sort((a,b) => {
    let va, vb;
    switch(sortCol){
      case 'title': va=a.title||''; vb=b.title||''; return va.localeCompare(vb, state.lang) * dir;
      case 'assignee': va=employeeName(a.assigneeId); vb=employeeName(b.assigneeId); return va.localeCompare(vb, state.lang) * dir;
      case 'status': va=STAGES.indexOf(a.status); vb=STAGES.indexOf(b.status); return (va-vb)*dir;
      case 'priority': const order={low:0,medium:1,high:2,urgent:3}; return (order[a.priority]-order[b.priority])*dir;
      case 'category': va=taskCategoryDisplayName(a); vb=taskCategoryDisplayName(b); return va.localeCompare(vb, state.lang) * dir;
      case 'start': va=a.startDate||''; vb=b.startDate||''; return va.localeCompare(vb)*dir;
      case 'due': va=a.dueDate||'9999'; vb=b.dueDate||'9999'; return va.localeCompare(vb)*dir;
      case 'workdays': va=calcWorkDays(a.startDate,a.completedDate||todayISO()); vb=calcWorkDays(b.startDate,b.completedDate||todayISO()); return (va-vb)*dir;
      default: return 0;
    }
  });
}

/* ---- Task page interactions ---- */
function setTaskView(v){ state.ui.taskView = v; renderPage(); }
function updateTaskFilter(key, val){ state.ui.taskFilters[key] = val; renderPage(); }
function toggleTaskPendingFilter(){ state.ui.taskFilters.pendingOnly = !state.ui.taskFilters.pendingOnly; renderPage(); }
function toggleReportPendingFilter(){ state.ui.reportFilters.pendingOnly = !state.ui.reportFilters.pendingOnly; renderPage(); }
function clearTaskFilters(){ state.ui.taskFilters = {q:'', status:'', priority:'', employee:'', category:'', pendingOnly:false, activeOnly:false, overdueOnly:false, from:'', to:''}; renderPage(); }
function goToTasksFiltered(filters){
  state.ui.taskFilters = Object.assign({q:'', status:'', priority:'', employee:'', category:'', pendingOnly:false, activeOnly:false, overdueOnly:false, from:'', to:''}, filters);
  state.ui.selectedTaskIds.clear();
  goPage('tasks');
}
function setSortCol(col){
  if(state.ui.sortCol === col) state.ui.sortDir = state.ui.sortDir==='asc'?'desc':'asc';
  else { state.ui.sortCol = col; state.ui.sortDir='asc'; }
  renderPage();
}
function toggleTaskSelect(id){
  if(state.ui.selectedTaskIds.has(id)) state.ui.selectedTaskIds.delete(id);
  else state.ui.selectedTaskIds.add(id);
  renderPage();
}
function toggleSelectAllVisible(checked){
  const visible = sortTasks(getFilteredTasks());
  visible.forEach(tk => { if(checked) state.ui.selectedTaskIds.add(tk.id); else state.ui.selectedTaskIds.delete(tk.id); });
  renderPage();
}
function clearSelection(){ state.ui.selectedTaskIds.clear(); renderPage(); }
function bulkChangeStatus(status){
  if(blockIfViewOnly()) return;
  if(!status) return;
  state.ui.selectedTaskIds.forEach(id => {
    const tk = state.tasks.find(x=>x.id===id);
    if(tk) updateTaskStageDates(tk, status);
  });
  saveData();
  toast(t('task_updated'));
  renderPage();
}
function bulkChangeCategory(value){
  if(blockIfViewOnly()) return;
  if(!value) return;
  const count = state.ui.selectedTaskIds.size;
  state.ui.selectedTaskIds.forEach(id => {
    const tk = state.tasks.find(x=>x.id===id);
    if(!tk) return;
    if(value === '__none__'){ tk.categoryId = ''; tk.categoryCustom = ''; }
    else { tk.categoryId = value; tk.categoryCustom = ''; }
  });
  saveData();
  toast(`${t('bulk_category_updated')} (${count})`);
  renderPage();
}
function bulkChangeAssignee(value){
  if(blockIfViewOnly()) return;
  if(!value) return;
  const count = state.ui.selectedTaskIds.size;
  const newAssigneeId = value === '__none__' ? '' : value;
  state.ui.selectedTaskIds.forEach(id => {
    const tk = state.tasks.find(x=>x.id===id);
    if(tk) tk.assigneeId = newAssigneeId;
  });
  saveData();
  toast(`${t('bulk_assignee_updated')} (${count})`);
  renderPage();
}
function bulkDeleteSelected(){
  if(blockIfViewOnly()) return;
  if(!confirm(t('confirm_delete_task'))) return;
  state.tasks = state.tasks.filter(tk => !state.ui.selectedTaskIds.has(tk.id));
  state.ui.selectedTaskIds.clear();
  saveData();
  toast(t('task_deleted'));
  renderPage();
}
function bulkPrintSelected(){
  const ids = Array.from(state.ui.selectedTaskIds);
  printTasksList(state.tasks.filter(tk => ids.includes(tk.id)));
}
function deleteTask(id){
  if(blockIfViewOnly()) return;
  if(!confirm(t('confirm_delete_task'))) return;
  state.tasks = state.tasks.filter(tk => tk.id !== id);
  state.ui.selectedTaskIds.delete(id);
  saveData();
  toast(t('task_deleted'));
  renderPage();
}

function submitEmployeeTaskUpdate(taskId){
  if(!state.session) return;
  const tk = state.tasks.find(x=>x.id===taskId);
  if(!tk || tk.assigneeId !== state.session.employeeId) return;
  const newStatus = document.getElementById('emp_update_status').value;
  const isPending = document.getElementById('emp_update_pending').checked;
  const pendingReason = isPending ? document.getElementById('emp_update_pending_reason').value.trim() : '';
  const commentText = document.getElementById('emp_update_comment').value.trim();

  if(newStatus !== tk.status) updateTaskStageDates(tk, newStatus);
  if(isPending && !tk.isPending) tk.pendingSince = todayISO();
  if(!isPending) tk.pendingSince = null;
  tk.isPending = isPending;
  tk.pendingReason = pendingReason;
  if(commentText){
    if(!tk.comments) tk.comments = [];
    const authorName = currentSessionEmployee() ? currentSessionEmployee().name : state.session.username;
    tk.comments.push({id: uid('cmt'), author: authorName, text: commentText, time: Date.now()});
  }
  saveData();
  renderPage();
  toast(t('emp_update_saved'));
  openEmployeeTaskUpdateModal(taskId);
}

function onKpiDefSelectChange(){

function updateKpiLivePreview(){
  const scoreEl = document.getElementById('kpi_score');
  const previewEl = document.getElementById('kpiLivePreview');
  if(!scoreEl || !previewEl) return;
  let score = parseInt(scoreEl.value, 10);
  if(isNaN(score)) score = 0;
  score = Math.max(0, Math.min(10, score));
  const lvl = performanceLevel(score);
  previewEl.innerHTML = `<span class="muted">${t('preview_level')}:</span> <span class="badge" style="background:${lvl.color}22; color:${lvl.color};">${t(lvl.key)}</span>`;
}
function kpiScoreColor(score){
  return performanceLevel(score).color;
}
function addKpi(taskId){
  if(blockIfViewOnly()) return;
  const tk = state.tasks.find(x=>x.id===taskId);
  if(!tk) return;
  const defSelect = document.getElementById('kpi_def_select').value;
  const empId = document.getElementById('kpi_emp').value;
  let score = parseInt(document.getElementById('kpi_score').value, 10);
  let defId = '', customName = '';
  if(defSelect === '__custom__'){
    customName = document.getElementById('kpi_custom_name').value.trim();
    if(!customName){ toast(t('required_field'), 'err'); return; }
  } else {
    defId = defSelect;
  }
  if(isNaN(score)) score=5;
  score = Math.max(1, Math.min(10, score));
  if(!tk.kpis) tk.kpis = [];
  tk.kpis.push({id: uid('kpi'), employeeId: empId, defId, name: customName, score, date: todayISO()});
  saveData();
  renderTaskModal();
  renderPage();
  toast(t('task_updated'));
}
function deleteKpi(taskId, kpiId){
  if(blockIfViewOnly()) return;
  const tk = state.tasks.find(x=>x.id===taskId);
  if(!tk) return;
  tk.kpis = (tk.kpis||[]).filter(k=>k.id!==kpiId);
  saveData();
  renderTaskModal();
  renderPage();
}

function addComment(taskId){

  const tk = state.tasks.find(x=>x.id===taskId);
  if(!tk) return;
  const text = document.getElementById('cmt_text').value.trim();
  const author = document.getElementById('cmt_author').value || 'Admin';

  if(!tk.comments) tk.comments = [];
  tk.comments.push({id: uid('cmt'), author, text, time: Date.now()});
